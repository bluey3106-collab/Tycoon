function nextAction(){
  const g=curG(); if(managed(g)) return `<div class="alert"><div class="eyebrow goldc">${g.franchise?"Franchise":"Managed"}</div><div style="font-size:14.5px">${g.franchise?`A franchisee runs ${esc(g.name)} and pays you 10% of turnover every night.`:`Your manager is running ${esc(g.name)}: booking jobs, ordering parts and handing cars back.`}</div></div>`;
  const dt=DAY_TYPES.find(d=>d.id===S.dayType)||DAY_TYPES[2];
  const waiting=g.jobs.filter(j=>j.status==="waiting"); const {short}=partsNeeded(S); const startable=waiting.find(j=>canStart(S,g,j).parts);
  let t,b="";
  if(startable&&bayFree(g)){ const c=canStart(S,g,startable); t=`<b>${JOB[startable.job].name}</b> for ${esc(startable.cust)} is ready to start.`; b=startBtns(g,startable,c); }
  else if(Object.keys(short).length){ t=`Accepted jobs are <b>waiting on parts</b>.`; b=`<button class="btn small" type="button" data-goto="parts">Order parts</button>`; }
  else if(g.board.length){ t=`<b>${g.board.length} new enquir${g.board.length>1?"ies":"y"}</b> on the job board.`; b=`<button class="btn small" type="button" data-goto="jobs" data-seg="new">View</button>`; }
  else t=`Waiting for customers. ${dt.note}`;
  return `<div class="alert"><div class="sechead"><span class="eyebrow goldc">Next up</span><span class="chips">${S.burstUntil>S.t?`<span class="chip y">Rush on now</span>`:""}<span class="chip ${dt.mult>1?"g":dt.mult<1?"b":""}">${dt.name}</span>${(S.fame||0)>=10?`<span class="chip y">Fame +${Math.round(fameEff(S)/4)}%</span>`:""}</span></div><div style="font-size:14.5px">${t}</div>${b?`<div class="chips">${b}</div>`:""}</div>`;
}
function profitChart(){
  const d=S.reports.slice(-14);
  if(!d.length) return `<div class="empty" style="padding:10px 0">Your first day's figures appear here at midnight.</div>`;
  const W=600,H=110,pad=18,max=Math.max(100,...d.map(x=>Math.abs(x.profit))),zero=H/2,bw=(W-pad)/14;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily profit"><line x1="${pad}" x2="${W}" y1="${zero}" y2="${zero}" stroke="#3a3a3a"/>${d.map((x,i)=>{ const h=Math.abs(x.profit)/max*(H/2-10); return `<rect x="${pad+i*bw+3}" y="${x.profit>=0?zero-h:zero}" width="${bw-6}" height="${Math.max(1,h)}" rx="2" fill="${x.profit>=0?"var(--gold)":"var(--bad)"}"><title>Day ${x.day}: ${money(x.profit)}</title></rect>`; }).join("")}</svg>`;
}
function healthRing(h,size){
  const r=size/2-9, c=2*Math.PI*r, col=h.score>=70?"var(--good)":h.score>=55?"var(--gold)":"var(--bad)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Business health ${h.grade}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#2b2b2b" stroke-width="9" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c*h.score/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="48%" text-anchor="middle" fill="var(--fg)" font-family="Archivo" font-weight="800" font-size="${size*.3}">${h.grade}</text><text x="50%" y="68%" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono" font-size="${size*.11}">${h.score}/100</text></svg>`;
}
function healthCard(compact){
  const h=health(S);

/* ---------- jobs ---------- */
function workerName(g,w){ if(w==="owner") return "You"; const st=g.staff.find(x=>x.id===w); return st?st.name:"Staff"; }
function workerArt(g,w,J){ if(w==="owner") return J?J.art:"garage_inside"; const st=g.staff.find(x=>x.id===w); return st?ROLES[st.role].art:"staff_mechanic"; }
function startBtns(g,q,c){
  if(!c.parts) return `<button class="btn small ghost" type="button" data-goto="parts">Order parts</button>`;
  if(!c.bayFree) return `<span class="chip b">All ${g.bays} bay${g.bays>1?"s":""} busy</span>`;
  let b="";
  const mins=w=>dur(q.workLeft/((w==="owner"?1:ROLES[g.staff.find(x=>x.id===w).role].speed)*(g.equipment.impact?1/0.9:1)));
  const free=freeTechs(g);
  if(techs(g).length) b+=`<div class="who"><div class="eyebrow">Who does it?</div>${techs(g).map(st=>{ const R=ROLES[st.role]; const busy=workerBusy(g,st.id); return `<button class="whobtn" type="button" data-start="${g.id}:${q.id}:${st.id}" ${busy?"disabled":""}>${img(R.art,R.name)}<span><b>${esc(st.name)}</b><small>${R.name}${R.cut?" · takes 40% of labour":""}</small></span><span class="num">${busy?"Busy":mins(st.id)}</span></button>`; }).join("")}</div>`;
  if(c.owner) b+=`<button class="btn small ghost" type="button" data-start="${g.id}:${q.id}:owner">Do it yourself · ${mins("owner")}</button>`;
  if(techs(g).length) b+=`<div class="muted" style="font-size:12px;width:100%">Once it's on the lift you can add more mechanics, or help yourself, to speed it up.</div>`;
  if(!free.length&&!c.owner) b+=`<span class="chip b">Everyone's busy</span>`;
  return b;
}
function bayStrip(g){
  const onLift=g.jobs.filter(j=>j.status==="working"||j.status==="done");
  const cards=onLift.map(j=>{ const J=JOB[j.job]; const p=j.status==="done"?1:1-j.workLeft/j.workTotal;

      <div><div class="line"><span>Jobs completed</span><span class="num">${a.jobs}</span></div><div class="line"><span>Cash change</span><span class="num ${a.cash<0?"bad":"good"}">${money(a.cash)}</span></div><div class="line"><span>Cars ready to hand back</span><span class="num">${a.ready}</span></div><div class="line"><span>Enquiries waiting</span><span class="num">${a.waiting}</span></div>${a.popups?`<div class="line"><span>Bills to deal with</span><span class="num">${a.popups}</span></div>`:""}</div>

function casinoClick(t,d){

  if(d.cchip){ casBet=+d.cchip; render(); return true; }
  if(d.bj){ const a=d.bj; if(a==="deal"){ if(bj.phase!=="play") bjDeal(); } else if(bj.phase==="play"){
      if(a==="hit"){ bj.me.push(bjDraw()); if(bjVal(bj.me).t>=21) bjFinish(); else render(); }
      else if(a==="stand") bjFinish();
      else if(a==="double"&&bj.me.length===2&&S.cash>=bj.bet){ casPay(-bj.bet); bj.bet*=2; bj.me.push(bjDraw()); bjFinish(); } } return true; }

    if(a==="spin") rlSpin(); else if(a==="clear"){ const tot=Object.values(rl.bets).reduce((x,y)=>x+y,0); casPay(tot); rl.bets={}; render(); }
    else if(a==="rebet"){ const tot=Object.values(rl.lastBets||{}).reduce((x,y)=>x+y,0); if(S.cash<tot) return showToast("Not enough cash."),true; casPay(-tot); rl.bets={...rl.lastBets}; render(); }
    else { const b=curBet(); if(S.cash<b) return showToast("Not enough cash."),true; casPay(-b); rl.bets[a]=(rl.bets[a]||0)+b; sfx("done"); render(); } return true; }
  if(d.sl){ if(d.sl==="spin") slSpin(); else { if(sl.auto){ sl.auto=0; render(); } else { sl.auto=10; slSpin(); } } return true; }
  if(d.pk){ const [a,v]=d.pk.split("|");
    if(a==="sit") pkSit(+v); else if(a==="leave") pkLeave(); else if(a==="next"){ if(pk&&pk.over) pkNewHand(); }
    else if(a==="rebuy"){ const T=PK_TABLES[pk.ti]; if(S.cash<T.buy) return showToast("Not enough cash."),true; casPay(-T.buy); pk.p[0].stack+=T.buy; pk.paid=(pk.paid||T.buy)+T.buy; pk.bust=false; pkNewHand(); }
    else if(a==="fold") pkMe("fold"); else if(a==="call") pkMe("call"); else if(a==="raise") pkMe("raise",+v); return true; }
  if(d.bk){ if(d.bk==="place"){ if(!bkSel) return true; const r=placeBet(S,bkSel.g,bkSel.k,curBet()); if(r.ok){ casStats(); bkSel=null; showToast(S.club?"Bet placed… keep it quiet. 🤫":"Bet placed. Good luck!"); sfx("cash"); save(); } else showToast(r.msg); render(); return true; }
    const [g,k]=d.bk.split("|"); bkSel=bkSel&&bkSel.g===+g&&bkSel.k===k?null:{g:+g,k}; render(); return true; }
  return false; }

function suppliersHtml(){ const I=inv(S); const own=Object.entries(I).filter(([,v])=>v.n>0);
  const tog=`<div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:10px" role="tablist">${[["fr","🚀 Frontier Suppliers"],["biz","🏢 Business Suppliers"]].map(([k,l])=>`<button type="button" role="tab" data-supg="${k}" aria-selected="${supG===k}">${l}</button>`).join("")}</div>`;
  return tog+`<div class="card"><h3>🏬 Your warehouse</h3>${own.length?own.filter(([id])=>ITEMS[id]&&ITEMS[id].g===supG).map(([id,v])=>`<div class="line"><span>${ITEMS[id].n}</span><span class="num">${fmtN(v.n)} <span class="chip ${v.q>=1.03?"g":v.q<.95?"b":""}">${v.q>=1.03?"Premium":v.q<.95?"Budget":"Standard"}</span></span></div>`).join("")||'<div class="muted" style="font-size:12.5px">Nothing in this section yet.</div>':'<div class="muted" style="font-size:12.5px">Empty. Everything you build, launch, train or run needs materials — buy them below.</div>'}
   ${supG==="biz"?`<div class="muted" style="font-size:12px">Your businesses use supplies every night. With auto-restock on, they buy the cheapest option themselves (+8% delivery). Buy premium yourself and they earn more.</div>`:`<div class="muted" style="font-size:12px">Premium parts make rockets more reliable, missions safer and cars score higher. Budget parts save money… and sometimes explode.</div>`}</div>
  <div class="list">${SUPCO.filter(x=>x.g===supG).map(X=>`<div class="card"><div class="sechead"><h3>${esc(X.name)}</h3></div><div class="muted" style="font-size:12px">${esc(X.blurb)}</div>${Object.entries(X.sells).map(([id,[pr,q]])=>`<div class="line" style="align-items:center;gap:6px"><span><b>${ITEMS[id].n}</b> <span class="chip ${q>=1.03?"g":q<.95?"b":""}">${q>=1.03?"Premium":q<.95?"Budget":"Standard"}</span><br><span class="muted" style="font-size:12px">${shortMoney(pr)} per ${ITEMS[id].u} · you have ${fmtN(id==="gpu"?(S.ai?S.ai.gpus/1000:0):have(S,id))}</span></span><span style="display:flex;gap:4px">${[1,5,20].map(k=>`<button class="btn small ghost" type="button" data-buyi="${X.id}|${id}|${k}" ${S.cash<pr*k?"disabled":""}>×${k}</button>`).join("")}</span></div>`).join("")}</div>`).join("")}</div>`; }
function needBox(req,lbl){ return `<div class="muted" style="font-size:12px">${lbl||"Needs"}: ${reqStr(S,req)} · <button class="linkbtn" type="button" data-gosup="fr" style="font-size:12px">Suppliers ›</button></div>`; }
function supplyCard(b){ const nd=supplyNeed(S,b); if(!nd) return ""; const h=have(S,nd.id);
  return `<div class="card ${b.noSup?"casecard":""}"><h3>📦 Supplies</h3><div class="muted" style="font-size:12.5px">Uses ${nd.n}× ${ITEMS[nd.id].n} every night. In stock: <b class="${h>=nd.n?"good":"bad"}">${fmtN(h)}</b> (${h>=nd.n?`~${Math.floor(h/nd.n)} nights`:"not enough!"}).${b.noSup?" ⚠ Ran out last night — only earned 40%.":""}</div>
   <div class="line" style="align-items:center"><span>Auto-restock (cheapest supplier, +8%)</span><button class="switch" type="button" role="switch" data-bauto="${b.id}" aria-checked="${b.auto!==false}" aria-label="Auto-restock"></button></div><button class="linkbtn" type="button" data-gosup="biz">Buy supplies yourself ›</button></div>`; }
// ===== boot (must stay at the very end so every const above exists) =====
try{ if(S&&S.lastSeen) catchUpNow(Date.now()-S.lastSeen); }catch(e){ console.error(e); }
render();

</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
document.addEventListener("gesturestart",e=>e.preventDefault());
</script>

</html>
