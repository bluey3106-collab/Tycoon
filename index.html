function mbtn(b,act,a1,a2,label,cls,dis){ return `<button class="btn small ${cls||""}" type="button" data-mech="${b.id}|${act}|${a1??""}|${a2??""}" ${dis?"disabled":""}>${label}</button>`; }

    <div class="list" style="gap:6px">${MENUS[b.type].map((L,i)=>`<div class="line" style="align-items:center;gap:8px;${M[i].on?"":"opacity:.5"}"><span><b>${L[0]}</b><br><span class="muted" style="font-size:12px">${Math.round(L[1]*100)}% of demand · price ${Math.round(M[i].p*100)}%</span></span><span style="display:flex;gap:6px;align-items:center">${M[i].on?pm(b,"menuPrice",i):""}${mbtn(b,"menuToggle",i,0,M[i].on?"On":"Off",M[i].on?"":"ghost")}</span></div>`).join("")}</div>
    <div class="chips"><span class="chip ${menuMult(b)>=1?"g":"b"}">Takings ${Math.round(menuMult(b)*100)}% of normal</span></div></div>`; }

      <div><div class="sechead" style="font-size:13px"><span>${W[1]}</span><span class="num">${Math.round(o*100)}%</span></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:${o*100}%"></i></div></div>

  if(T==="club"){ const cur=X.dj||"local", tk=X.ticket||1;

     <div class="card"><h3>${W[2]}</h3><div class="muted" style="font-size:12px">Each new ${W[1]} adds demand for 4 more ${W[0]}.${F.places.length?` You have: ${F.places.map(esc).join(", ")}.`:""}</div><div>${mbtn(b,"cap","","",`${W[2]} · ${shortMoney(capCost(b))}`,"",S.cash<capCost(b))}</div>${mg(b).boss>=1?`<div class="muted" style="font-size:12px">Your manager fixes breakdowns automatically.</div>`:""}</div>`; }
  if(T==="bank"){ const B=bankState(b); return `<div class="card"><h3>Interest rates</h3>

      <div class="muted" style="font-size:12px">Set your asking price: ask more and it sits longer; ask less and it flies. "Trade" sells it instantly for 85% of its worth.</div></div>
     <div class="card"><h3>Today's auction</h3>${(X2.lots||[]).map(L=>`<div class="line" style="align-items:center;gap:8px"><span><b>${esc(L.name)}</b><br><span class="muted" style="font-size:12px">Worth ~£${fmt(L.value)} · potential profit £${fmt(L.value-L.cost)}</span></span>${mbtn(b,"buyLot",L.id,"",`Buy · ${shortMoney(L.cost)}`,"",S.cash<L.cost||X2.stock.length>=stockSlots(b))}</div>`).join("")||`<div class="muted">New lots soon.</div>`}<div class="muted" style="font-size:12px">New lots ${when(S,X2.lotsAt||S.t)}.</div></div>`; }
  if(T==="build"){ const B2=buildState(b); const slots=1+Math.floor(b.level/2);

     <div class="card"><h3>Your projects · ${B2.proj.length}/${slots}</h3>${B2.proj.map(pj=>{ const ready=pj.ready<=S.t; return `<div class="line" style="align-items:center;gap:8px"><span><b>${esc(pj.name)}</b><br><span class="muted" style="font-size:12px">Cost £${fmt(pj.cost)} · ${ready?`would sell for £${fmt(pj.val*B2.market)} today`:`ready ${when(S,pj.ready)}`}</span></span>${ready?mbtn(b,"sellProj",pj.id,"","Sell","green"):`<span class="chip">Building…</span>`}</div>`; }).join("")||`<div class="muted" style="font-size:12.5px">No projects underway.</div>`}</div>
     <div class="card"><h3>Start a project</h3>${PROJECTS.map(Pj=>`<div class="line" style="align-items:center;gap:8px"><span><b>${Pj.name}</b><br><span class="muted" style="font-size:12px">${Pj.days} days · usually sells for ~${shortMoney(P*Pj.val)}</span></span>${mbtn(b,"startProj",Pj.id,"",shortMoney(P*Pj.cost),"",S.cash<P*Pj.cost||B2.proj.length>=slots)}</div>`).join("")}</div>`; }
  if(T==="brand"){ const B3=brandState(b); const slots=1+Math.floor(b.level/2); const busy=B3.models.filter(m=>!m.launched||m.left>0).length;

  return ""; }
function bizPage(b){ const T=BIZ[b.type], M=mg(b); const exp=bizExpected(S,b), v=bizValue(S,b); const units=Math.max(1,Math.round(exp/(BIZ_SPEND[b.type]||100)));

   <div style="padding:12px;display:flex;flex-direction:column;gap:10px">

    <div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><span class="eyebrow">Last night</span><span class="v ${(b.today||0)>=0?"good":"bad"}" style="font-size:16px">${b.today!=null?shortMoney(b.today):"—"}</span></div><div class="tile"><span class="eyebrow">Usual night</span><span class="v" style="font-size:16px">${shortMoney(exp)}</span></div><div class="tile"><span class="eyebrow">${BIZ_UNIT[b.type]||"customers"} a night</span><span class="v" style="font-size:16px">${fmtN(units)}</span></div><div class="tile"><span class="eyebrow">Worth</span><span class="v goldc" style="font-size:16px">${shortMoney(v)}</span></div></div>

   </div></div>

    <div class="card"><div class="sechead"><h3>👕 Your clothing line</h3>${C.merch?`<span class="chip g">Level ${C.merch}/3</span>`:""}</div><div class="muted" style="font-size:12.5px">Earns more the more famous you are. ${C.merch?`Now ${money(merchWeekly(S))}/wk.`:"Needs 30 fame."}</div>${C.merch<3?`<div><button class="btn small ${C.merch?"ghost":""}" type="button" id="merchup" ${S.cash<MERCH_COST[C.merch]||f<30?"disabled":""}>${C.merch?"Expand":"Launch"} · ${money(MERCH_COST[C.merch])}</button></div>`:""}</div>

  else if(socSeg==="feed") body=so.feed.length?`<div class="feed">${so.feed.map(p=>`<div class="post">${avatar(p.user)}<div class="pb"><div class="ph"><b>${esc(p.user)}</b> <span class="muted">@${esc(p.handle)} · ${agoStr(p.t)}</span></div><div class="pt">${esc(p.text)}</div><div class="pm muted">💬 ${fmtN(Math.round(p.rts/2))} &nbsp; 🔁 ${fmtN(p.rts)} &nbsp; ❤️ ${fmtN(p.likes)}</div></div></div>`).join("")}</div>`:`<div class="muted" style="margin-top:12px">Nobody's talking about you yet. Do something worth talking about.</div>`;

  if(socSeg==="dms") setTimeout(()=>{ let ch=false; for(const d of so.dms) if(!d.read){ d.read=true; ch=true; } if(ch) save(); },1500); so.unreadFeed=0;
  return `<div class="sec">${prof}${seg}${body}</div>`; }

function nextAction(){
  const g=curG(); if(managed(g)) return `<div class="alert"><div class="eyebrow goldc">${g.franchise?"Franchise":"Managed"}</div><div style="font-size:14.5px">${g.franchise?`A franchisee runs ${esc(g.name)} and pays you 10% of turnover every night.`:`Your manager is running ${esc(g.name)}: booking jobs, ordering parts and handing cars back.`}</div></div>`;
  const dt=DAY_TYPES.find(d=>d.id===S.dayType)||DAY_TYPES[2];
  const waiting=g.jobs.filter(j=>j.status==="waiting"); const {short}=partsNeeded(S); const startable=waiting.find(j=>canStart(S,g,j).parts);
  let t,b="";
  if(startable&&bayFree(g)){ const c=canStart(S,g,startable); t=`<b>${JOB[startable.job].name}</b> for ${esc(startable.cust)} is ready to start.`; b=startBtns(g,startable,c); }
  else if(Object.keys(short).length){ t=`Accepted jobs are <b>waiting on parts</b>.`; b=`<button class="btn small" type="button" data-goto="parts">Order parts</button>`; }
  else if(g.board.length){ t=`<b>${g.board.length} new enquir${g.board.length>1?"ies":"y"}</b> on the job board.`; b=`<button class="btn small" type="button" data-goto="jobs" data-seg="new">View</button>`; }
  else t=`Waiting for customers. ${dt.note}`;
  return `<div class="alert"><div class="sechead"><span class="eyebrow goldc">Next up</span><span class="chips">${S.burstUntil>S.t?`<span class="chip y">Rush on now</span>`:""}<span class="chip ${dt.mult>1?"g":dt.mult<1?"b":""}">${dt.name}</span>${(S.fame||0)>=10?`<span class="chip y">Fame +${Math.round(fameEff(S)/4)}%</span>`:""}</span></div><div style="font-size:14.5px">${t}</div>${b?`<div class="chips">${b}</div>`:""}</div>`;
}
function profitChart(){
  const d=S.reports.slice(-14);
  if(!d.length) return `<div class="empty" style="padding:10px 0">Your first day's figures appear here at midnight.</div>`;
  const W=600,H=110,pad=18,max=Math.max(100,...d.map(x=>Math.abs(x.profit))),zero=H/2,bw=(W-pad)/14;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily profit"><line x1="${pad}" x2="${W}" y1="${zero}" y2="${zero}" stroke="#3a3a3a"/>${d.map((x,i)=>{ const h=Math.abs(x.profit)/max*(H/2-10); return `<rect x="${pad+i*bw+3}" y="${x.profit>=0?zero-h:zero}" width="${bw-6}" height="${Math.max(1,h)}" rx="2" fill="${x.profit>=0?"var(--gold)":"var(--bad)"}"><title>Day ${x.day}: ${money(x.profit)}</title></rect>`; }).join("")}</svg>`;
}
function healthRing(h,size){
  const r=size/2-9, c=2*Math.PI*r, col=h.score>=70?"var(--good)":h.score>=55?"var(--gold)":"var(--bad)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Business health ${h.grade}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#2b2b2b" stroke-width="9" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c*h.score/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="48%" text-anchor="middle" fill="var(--fg)" font-family="Archivo" font-weight="800" font-size="${size*.3}">${h.grade}</text><text x="50%" y="68%" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono" font-size="${size*.11}">${h.score}/100</text></svg>`;
}
function healthCard(compact){
  const h=health(S);
  return `<div class="card"><div class="sechead"><h3>Business health</h3>${compact?`<button class="btn small ghost" type="button" data-goto="money">Money</button>`:""}</div>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${healthRing(h,compact?96:120)}
    <div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px">${h.parts.map(x=>`<div><div class="sechead" style="font-size:13px"><span>${x.name}</span><span class="muted" style="font-size:12px">${x.label}</span></div><div class="bar ${x.score>=.7?"g":""}" style="margin-top:4px"><i style="width:${x.score*100}%;${x.score<.4?"background:var(--bad)":""}"></i></div></div>`).join("")}</div></div></div>`;
}

function workerArt(g,w,J){ if(w==="owner") return J?J.art:"garage_inside"; const st=g.staff.find(x=>x.id===w); return st?ROLES[st.role].art:"staff_mechanic"; }
function startBtns(g,q,c){
  if(!c.parts) return `<button class="btn small ghost" type="button" data-goto="parts">Order parts</button>`;

  S._toasts=[]; return S.t-t0; }

function redeemGift(code){ const m=/^SMT-([0-9A-Z])([0-9A-Z]{4})-([0-9A-Z]{4})$/.exec((code||"").trim().toUpperCase()); if(!m) return {ok:false,msg:"That doesn't look like a valid code."};
  const i=parseInt(m[1],36), n=parseInt(m[2],36), sig=parseInt(m[3],36); if(!GIFTS[i]||fnv(GIFT_K+":"+i+":"+n)%(36**4)!==sig) return {ok:false,msg:"That code isn't valid."};
  S.usedCodes=S.usedCodes||[]; const key=m[0]; if(S.usedCodes.includes(key)) return {ok:false,msg:"That code has already been used."}; S.usedCodes.push(key); GIFTS[i].f(S); S.log.unshift({t:S.t,x:`Redeemed a gift code: ${GIFTS[i].n}.`}); return {ok:true,msg:`🎁 Gift received: ${GIFTS[i].n}!`}; }

function devDo(a){ const [k,x,y]=a.split(":"); const g=curG();
  switch(k){
    case "skip": devSkip(+x); return `Skipped to ${weekday(S.t)} ${clock(S.t)}, day ${dayNo(S.t)}.`;
    case "at": devSkip(nextAt(x||null,+y)-S.t); return `It's now ${weekday(S.t)} ${clock(S.t)}.`;
    case "year": devSkip(Math.max(1,S.yearEnd-S.t+1)); return `Year ${S.year-1} closed.`;
    case "speed": S.speed=+x; return `Speed ${x}× (tap the speed button to go back).`;
    case "cash": if(+x===0) S.cash=0; else S.cash+=+x; return `Cash: ${money(S.cash)}`;
    case "fame": S.fame=+x; return `Fame ${x}.`;
    case "stars": for(let i=0;i<30;i++) S.reviews.unshift({stars:5,name:pick(S,NAMES),car:"",job:"Service",text:"Brilliant garage!",t:S.t}); S.reviews=S.reviews.slice(0,40); return "Reviews boosted.";
    case "debts": S.inbox=S.inbox.filter(p=>p.type!=="bill"); S.loans=[]; S.finance=[]; S.owedSuppliers=0; return "Debts cleared.";
    case "jobs": { let n=0; for(const G2 of S.garages) for(const q of G2.jobs){ q.status="done"; q.workLeft=0; q.doneAt=S.t; n++; } return `${n} job${n===1?"":"s"} ready to hand back.`; }

    case "stock": for(const c in PARTS) S.stock.push({cat:c,qty:20,unit:20,q:.95}); return "20 of every part added.";

    case "lifts": g.bays=LOCS[g.loc].maxBays; return `${g.name} now has ${g.bays} lifts.`;

    case "lotto": S.devLotto=true; return "You'll win the next lottery draw (if you have a ticket).";

    ${S.cash<p.amount?`<div class="bad" style="font-size:13px">You've only got ${money(S.cash)}. Paying now puts you overdrawn.</div>`:""}

}

  if(d.ask){ const [id,y]=parse(d.ask); const r=answerAsk(S,id,!!y); done(y?(r.ok!==false?"Approved — your manager's on it.":r.msg):"Told them not now.",y&&r.ok!==false?"cash":null); return; }
  if(d.story){ const [id,ci]=parse(d.story); const r=storyAnswer(S,id,ci); if(r.ok) S.inbox.unshift({id:S.nextId++,type:"info",title:r.title,text:r.res,tone:"neutral",showAt:S.t}); done(null,"ping"); return; }
  if(d.ok){ dismissInfo(S,+d.ok); done(); return; }
  if(d.sup){ supSel=d.sup; render(); return; }

  if(d.buypart){ const c=d.buypart; const q=qtyBy[c]??Math.max(1,partsNeeded(S).short[c]||1); const r=orderParts(S,supSel,c,q); if(r.ok){ delete qtyBy[c]; if(S.tut===1) S.tut=2; } done(r.msg,r.ok?"ping":"buzz"); return; }

  if(d.fin){ const [g,id]=parse(d.fin); const r=buyKit(S,g,id,true); done(r.ok?"On finance. Payments join your Monday bills.":r.msg,"ping"); return; }

  if(d.liftfin){ const r=buyLift(S,+d.liftfin,true); done(r.ok?"New lift fitted on finance.":r.msg,r.ok?"gun":"buzz"); return; }

  if(d.bseg){ bSeg=d.bseg; bizOpen=null; tab="garage"; render(); return; }
  if(d.build){ const r=buildBiz(S,d.build); if(r.ok) bSeg="empire"; done(r.ok?`${r.b.name} is open!`:r.msg,r.ok?"cash":"buzz"); return; }
  if(d.deal){ const r=buyDeal(S,+d.deal); if(r.ok) bSeg="empire"; done(r.ok?`${r.b.name} is yours.`:r.msg,r.ok?"cash":"buzz"); return; }
  if(d.mech){ const [id,act,a1,a2]=d.mech.split("|"); const n=v=>v===""?undefined:(isNaN(+v)?v:+v); const r=mechAction(S,+id,act,n(a1),n(a2)); done(r&&r.msg?r.msg:(r&&r.ok===false&&r.msg)?r.msg:null,r&&r.ok?null:"buzz"); return; }

  if(d.bboss){ const [id,l]=d.bboss.split(":"); const r=hireBoss(S,+id,+l); done(r.ok?"New boss in charge.":r.msg,r.ok?"cash":"buzz"); return; }
  if(d.bdec){ const [id,i]=d.bdec.split(":"); const r=bizDecide(S,+id,+i); if(r.ok) S.inbox.push({id:S.nextId++,type:"info",title:"Decision made",text:r.res,tone:"neutral",showAt:S.t}); done(); return; }
  if(d.bup){ const r=upgradeBiz(S,+d.bup); done(r.ok?`${r.b.name} is now level ${r.b.level}.`:r.msg,r.ok?"gun":"buzz"); return; }

  if(d.bact){ const [id,a]=d.bact.split(":"); const r=bizAct(S,+id,a); if(r.ok) S.inbox.push({id:S.nextId++,type:"info",title:r.name,text:r.msg,tone:r.tone,showAt:S.t}); done(r.ok?null:r.msg,r.ok?(r.tone==="bad"?"buzz":"cash"):"buzz"); return; }
  if(d.stake){ const [id,p]=d.stake.split(":"); const r=buyStake(S,id,+p); done(r.ok?`Bought ${Math.round(+p*100)}% for ${money(r.c)}.`:r.msg,r.ok?"cash":"buzz"); return; }
  if(d.unstake){ const [id,p]=d.unstake.split(":"); const r=sellStake(S,id,+p); done(r.ok?`Sold for ${money(r.v)}.`:"",r.ok?"cash":"buzz"); return; }
  if(d.takeover){ const r=takeControl(S,d.takeover); if(r.ok){ S.inbox.push({id:S.nextId++,type:"info",title:"Hostile takeover!",text:`You bought out the other shareholders for ${money(r.rest)}. ${r.R.name} is now part of your empire.`,tone:"good",showAt:S.t}); bSeg="empire"; } done(r.ok?null:r.msg,r.ok?"rush":"buzz"); return; }
  if(d.grp){ const r=tradeGroup(S,+d.grp); done(r.ok?(+d.grp<0?`Sold shares for ${money(r.v)}.`:`Bought back for ${money(r.c)}.`):r.msg,r.ok?"cash":"buzz"); return; }
  if(d.soc){ socSeg=d.soc; render(); return; }
  if(d.dm){ const [id,y]=d.dm.split(":"); const r=answerDm(S,+id,y==="1"); done(r.msg||null,r.ok&&!r.bad?(y==="1"?"cash":null):"buzz"); return; }
  if(d.cdo){ const [id,b]=parse(d.cdo); const r=cityDo(S,id,b); if(r.ok){ S.inbox.push({id:S.nextId++,type:"info",title:(cityActs(S.at).find(x=>x.id===id)||{}).name||"",text:r.msg,tone:r.tone,showAt:S.t}); } done(r.ok?null:r.msg,r.ok?(r.tone==="bad"?"buzz":"cash"):"buzz"); return; }
  if(d.hrole){ hireRole=d.hrole; render(); return; }
  if(d.hire){ const [g,role,cid]=d.hire.split(":"); const r=hire(S,+g,role,cid); done(r.ok?`${r.st.name} starts today at ${G(S,+g).name}.`:r.msg,r.ok?"cash":"buzz"); return; }
  if(d.fire){ const [g,id]=parse(d.fire); if(t.dataset.armed){ const r=fire(S,g,id); done(r.ok?"They've left.":r.msg); } else { t.dataset.armed="1"; t.textContent="Tap again"; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent="Let go"; } },3000); } return; }
  if(d.open){ const r=openGarage(S,d.open); done(r.ok?`${r.g.name} is open — you're now viewing it.`:r.msg,r.ok?"cash":"buzz"); return; }

  if(t.id==="copysave"){ save(); const code=btoa(unescape(encodeURIComponent(localStorage.getItem(SAVE_KEY)||JSON.stringify(S)))); const box=document.getElementById("savebox"); box.hidden=false; box.value=code; try{ navigator.clipboard.writeText(code).then(()=>showToast("Save code copied."),()=>{ box.select(); showToast("Select and copy the code below."); }); }catch(e){ box.select(); showToast("Select and copy the code below."); } return; }
  if(t.id==="loadsave"){ const box=document.getElementById("savebox"); if(box.hidden||!box.value.trim()){ box.hidden=false; box.focus(); showToast("Paste your code, then tap Load again."); return; } try{ const s=migrate(JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))))); if(!s||!s.stats) throw 0; S=s; S.paused=false; save(); tab="home"; render(); showToast("Save loaded."); }catch(e){ showToast("That code didn't work. Check you copied all of it."); } return; }
  if(t.id==="restart"){ if(t.dataset.armed){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} if(cloudDoc) cloudDoc.delete().catch(()=>{}); S=null; ob={step:0,name:"",garage:""}; render(); } else { t.dataset.armed="1"; t.textContent="Tap again to wipe"; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent="New game"; } },3000); } return; }

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(!S){ if(t.id==="obname"){ ob.name=t.value; document.getElementById("obnext1").disabled=!t.value.trim(); } if(t.id==="obgarage"){ ob.garage=t.value; document.getElementById("obgo").disabled=!t.value.trim(); } return; }
  if(t.id==="rate"){ S.rate=+t.value; document.getElementById("rateV").textContent=`£${S.rate}/hr`; }
  if(t.id==="mk"){ S.markup=+t.value/100; document.getElementById("mkV").textContent=`${Math.round(S.markup*100)}%`; }
  if(t.id==="tprice"&&S.club){ S.club.price=+t.value; document.getElementById("tpV").textContent=`£${S.club.price}`; }
  if(t.id==="wage"){ S.wage=+t.value; document.getElementById("wageV").textContent=`${money(S.wage)}/wk`; }
});
document.addEventListener("change",ev=>{ if(S&&["rate","mk","wage","tprice"].includes(ev.target.id)){ save(); render(); } });
document.addEventListener("keydown",ev=>{ if(S) return; if(ev.key==="Enter"){ if(ob.step===0){ if(cloudReady){ ob.step=1; render(); } } else if(ob.step===1) document.getElementById("obnext1")?.click(); else document.getElementById("obgo")?.click(); } if(ob.step===0&&ev.key===" "&&cloudReady){ ob.step=1; render(); } });

/* ---------- the loop ---------- */
let acc=0, last=performance.now(), saveAt=0;
let matchTimer=null; function matchTick(){ clearInterval(matchTimer); matchTimer=setInterval(()=>{ if(!sheet||sheet.type!=="match"){ clearInterval(matchTimer); return; } if(sheet.shown>90){ clearInterval(matchTimer); return; } const before=sheet.m.ev.filter(e=>e.m<=sheet.shown).length; sheet.shown+=1; const now=sheet.m.ev.filter(e=>e.m<=sheet.shown); if(now.length>before&&now[now.length-1].t==="goal") sfx(now[now.length-1].us?"cash":"buzz"); if(sheet.shown===91) sfx(sheet.m.res==="W"?"rush":"ping"); render(); },160); }
function catchUpNow(ms){ if(!S) return; const a=catchUp(S,ms); if(a){ sheet={type:"away",a}; S._toasts=[]; render(); } }
function loop(){
  const now=performance.now(); const dt=Math.min(now-last,2000); last=now;
  if(S&&!document.hidden){
    const popup=currentPopup(S);
    if(!S.paused&&!popup&&!sheet){ acc+=dt*S.speed*(nightFF(S)?4:1)/REAL_MS_PER_MIN; const n=Math.floor(acc); if(n>0){ acc-=n; advance(S,Math.min(n,120)); } } else acc=0;
    if(S._toasts&&S._toasts.length){ const ts=S._toasts.splice(0); const pri={cash:3,rush:2,done:1}; const x=ts.reduce((b,y)=>(pri[y.snd]||0)>=(pri[b.snd]||0)?y:b,ts[0]); showToast(ts.length>1&&!pri[x.snd]?`${x.t} (+${ts.length-1} more)`:x.t); sfx(x.snd); }
    const p2=currentPopup(S); if(p2&&p2!==popup&&p2.type==="bill") sfx("bill");
    const busy=now-lastPointer<600||document.activeElement?.type==="range";
    if((S._dirty||(p2&&!document.querySelector(".modal")))&&!busy) render(); else live();
    if(now>saveAt){ save(); cloudPush(false); saveAt=now+5000; }
  }
}
setInterval(loop,200);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ hiddenAt=Date.now(); save(); cloudPush(true); } else { last=performance.now(); if(hiddenAt&&S) catchUpNow(Date.now()-hiddenAt); hiddenAt=0; } });
if(S&&S.lastSeen) catchUpNow(Date.now()-S.lastSeen);
render();

</script>

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
