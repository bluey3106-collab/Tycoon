<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Self Made Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="morphdom.min.js"></script>
<style>
/* Layout: native-app shell. Fixed header (clock, cash), scrolling screen, fixed tab bar. Art panels share the renders' charcoal so they float seamlessly. Single committed dark theme. */
:root{
  --bg:#121212; --panel:#212121; --panel2:#1a1a1a; --line:#2f2f2f; --fg:#ece8df; --muted:#9b968c; --dim:#6d6a63;
  --gold:#d4a64a; --gold2:#f1d08a; --good:#62c48b; --goodbg:rgba(98,196,139,.10); --bad:#e57d63; --info:#86aee0;
  --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:700;font-variation-settings:"wdth" 112}
h3{font-size:15px;font-weight:650}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .goldc{color:var(--gold)}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:16px 4px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--gold);color:#1a1408;transition:transform .08s, background .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.btn.green{background:var(--good);color:#0d2016}
.btn.small{padding:9px 13px;border-radius:11px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{background:var(--line);color:var(--dim);cursor:not-allowed;border-color:transparent}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- splash & onboarding ---------- */
.ob{min-height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;padding-block:24px calc(24px + env(safe-area-inset-bottom,0px))}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.splash{cursor:pointer;text-align:center;align-items:center}
.splash .art{width:min(100%,520px);margin:0 auto;animation:float 6s ease-in-out infinite}
.splash .art img{width:100%;display:block}
.title{font-size:clamp(40px,12vw,68px);font-weight:800;font-variation-settings:"wdth" 125;line-height:.92;letter-spacing:-.01em}
.title span{color:var(--gold)}
.tap{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.step{animation:slidein .35s ease-out}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:#333}
.dots i.on{background:var(--gold);width:20px}
.bigq{font-size:clamp(28px,7vw,40px);font-weight:750;font-variation-settings:"wdth" 110;line-height:1.05}
.biginput{width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--fg);font:inherit;font-size:28px;font-weight:650;padding:10px 0}
.biginput:focus{outline:none;border-color:var(--gold)}
.obart{background:var(--panel);border-radius:22px;overflow:hidden;max-width:360px;align-self:center;width:100%}
.obart img{display:block;width:100%}

/* ---------- app chrome ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.clk{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.02em}
.clkwrap{min-width:0;flex:0 1 auto;overflow:hidden}
.ctrl{display:flex;gap:4px;margin-left:4px}
.ctrl button{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:32px;min-width:36px;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 8px}
.ctrl button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
.money{margin-left:auto;text-align:right;flex:none;white-space:nowrap}
.ctrl{flex:none}
.cash{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--gold)}
.cash.neg{color:var(--bad)}
.starsv{font-family:var(--mono);font-size:12px;color:var(--gold2)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding-block:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;background:var(--good);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.spark i.neg{background:var(--bad)}
.feed{display:flex;flex-direction:column;margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel2)}
.post{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post .card.decision{border-color:rgba(224,160,48,.6);background:linear-gradient(135deg,rgba(224,160,48,.10),transparent)}
.bizopen img{transition:transform .3s}
.bizopen:active img{transform:scale(1.02)}
.avatar{width:40px;height:40px;font-size:14px}
.post .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.post .ph{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .pt{font-size:14.5px;line-height:1.4}
.post .pm{font-size:12px}
.dm.unread{border-color:rgba(224,160,48,.55)}
.dm .avatar{width:40px;height:40px;font-size:14px}
.tab{background:none;border:0;padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--dim);font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--gold2)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#1a1408;font-size:10.5px;font-family:var(--mono);font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge.g{background:var(--good);color:#0d2016}
.screen{padding-top:calc(84px + env(safe-area-inset-top,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}

/* ---------- shared ---------- */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ig{position:relative;background:var(--panel);border-radius:20px;overflow:hidden}
.ig img{display:block;width:100%;height:auto}
.call{position:absolute;display:flex;align-items:center;gap:6px;pointer-events:none}
.call .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent);flex:none}
.call .ln{height:1px;background:var(--gold);width:clamp(12px,4vw,36px);flex:none;opacity:.8}
.call .lb{background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:9px;padding:4px 8px;font-size:11.5px;white-space:nowrap}
.call .lb b{font-family:var(--mono);color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:700}
.alert{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 7%,transparent);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cityhero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--th)}
.cityhero .ig{border-radius:0;margin:0}
.cityov{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,0));display:flex;flex-direction:column;gap:2px}
.cityname{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
.citytag{font-size:13px;color:var(--th);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.citycard,.actcard{border-left:3px solid var(--th)}
.st-tokyo .cityname{color:#ffe3ec;text-shadow:0 0 8px #ff4d6d,0 0 22px #ff4d6d;font-family:ui-monospace,Menlo,monospace}
.st-tokyo{box-shadow:0 0 24px rgba(255,77,109,.35)}
.st-neon .cityov{border-top:6px solid #f2d14b}
.st-neon .cityname{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;text-transform:uppercase}
.st-miami .cityname{background:linear-gradient(90deg,#ff7aa8,#5ee7df);-webkit-background-clip:text;background-clip:text;color:transparent}
.st-miami{box-shadow:0 0 24px rgba(94,231,223,.25)}
.st-gold .cityname,.st-riviera .cityname{background:linear-gradient(90deg,#fff1c1,#d4a64a);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Georgia,serif;font-style:italic}
.st-riviera .citytag{font-family:Georgia,serif;text-transform:none;font-style:italic;font-size:15px}
.st-sun .cityov{background:linear-gradient(0deg,rgba(80,30,0,.85),rgba(0,0,0,0))}
.st-brick .cityname{font-family:"Arial Black",sans-serif;text-transform:uppercase}
.st-classic .cityname{font-family:Georgia,serif}
.citystrip{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;margin-top:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--th);background:linear-gradient(90deg,color-mix(in srgb,var(--th) 22%,transparent),transparent);color:var(--fg);font-size:13.5px;cursor:pointer;text-align:left}
.lifegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lifetile{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;background:var(--panel);cursor:pointer;aspect-ratio:4/3;color:var(--fg);text-align:left}
.lifetile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.8}
.lifetile .lt{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.lifetile .lt b{font-size:15px;color:#fff}
.lifetile[aria-pressed="true"]{border:2px solid var(--gold,#d4a64a);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.lifetile[aria-pressed="true"] img{opacity:1}

/* whole-app city themes */
:root[data-city]{transition:background-color .4s}
:root[data-city="manchester"]{--bg:#141011;--panel:#241b1b;--panel2:#1c1515;--line:#3a2a28;--gold:#e0704f;--gold2:#f2a488}
:root[data-city="monaco"]{--bg:#0b1020;--panel:#162038;--panel2:#10182c;--line:#26324f;--gold:#e3c47e;--gold2:#f6e2b0;--muted:#9aa4bd}
:root[data-city="marbella"]{--bg:#17110b;--panel:#2a1e13;--panel2:#20170f;--line:#3d2c1c;--gold:#f2a25a;--gold2:#ffd0a0}
:root[data-city="dubai"]{--bg:#15110a;--panel:#261f11;--panel2:#1d180d;--line:#3c311a;--gold:#f3c95a;--gold2:#ffe69a}
:root[data-city="newyork"]{--bg:#0f0f10;--panel:#1d1d20;--panel2:#161618;--line:#34343a;--gold:#f6d33c;--gold2:#ffe98a}
:root[data-city="miami"]{--bg:#120f1c;--panel:#221b33;--panel2:#1a1528;--line:#3a2f55;--gold:#ff7aa8;--gold2:#ffb3cc;--good:#5ee7df}
:root[data-city="tokyo"]{--bg:#0b0912;--panel:#1a1426;--panel2:#130f1d;--line:#33284a;--gold:#ff4d6d;--gold2:#ff9fb1;--muted:#a59bb8}
:root[data-city="air"]{--bg:#0e1116;--panel:#1a1f27;--panel2:#141820;--line:#2a313c;--gold:#9cc3ff;--gold2:#cfe1ff}
:root[data-city="tokyo"] .btn:not(.ghost){box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}
:root[data-city="newyork"] h2{text-transform:uppercase;letter-spacing:.03em}
:root[data-city="monaco"] h2,:root[data-city="dubai"] h2{font-family:Georgia,serif;font-style:italic;font-weight:600}
:root[data-city="miami"] h2{background:linear-gradient(90deg,#ff7aa8,#5ee7df);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg.hseg{display:flex;gap:2px}
.hseg::-webkit-scrollbar{display:none}
.seg.hseg button{flex:1 1 auto;white-space:nowrap;padding:9px 6px;font-size:13.5px}
.clkwrap .eyebrow{white-space:nowrap}
.ctrl button{min-width:32px}
.chip.amber{border-color:#e0a030;color:#f0b84a;background:rgba(224,160,48,.10)}
.prow.mgr{border-color:rgba(224,160,48,.55);background:rgba(224,160,48,.06)}
.wccard{border-color:rgba(224,160,48,.45);background:linear-gradient(135deg,rgba(224,160,48,.08),transparent)}
.winopen{border-color:rgba(98,196,139,.5)}
.devcard{border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent)}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;color:#f4efe4;letter-spacing:.02em;border:2px solid rgba(255,255,255,.12)}
.ball{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--fg);background:transparent}.ball.hit{background:linear-gradient(145deg,#f3d27a,#c99a2e);color:#1a1405;border-color:transparent}.balls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.lotto-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center;margin:8px 0}.pickb{cursor:pointer;width:38px;height:38px}.lotto-jp{font-size:clamp(28px,9vw,40px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#f6dc8c,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap}
.chip.g{border-color:rgba(98,196,139,.45);color:var(--good)}
.chip.b{border-color:rgba(229,125,99,.5);color:var(--bad)}
.chip.y{border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold2)}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.chart svg{display:block;width:100%;height:110px}
.log{font-size:13.5px;display:flex;flex-direction:column}
.log div{padding:8px 0;border-top:1px solid var(--panel)}
.log div:first-child{border-top:0}
.log .d{color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-right:6px}
.ms{display:flex;flex-direction:column;gap:10px}
.ms .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.bar.g i{background:var(--good)}

/* ---------- jobs ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:650;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--line);color:var(--fg)}
.seg .n{font-family:var(--mono);color:var(--gold2);margin-left:4px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.list{grid-template-columns:1fr 1fr}}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.job .top2{display:flex;gap:12px;padding:12px;align-items:center}
.thumb{width:62px;height:62px;border-radius:14px;background:var(--panel);flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.job .meta{min-width:0;flex:1}
.job .car{font-size:13px;color:var(--muted)}
.price{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--gold2)}
.job .chips{padding:0 12px 10px}
.job .act{display:flex;gap:8px;padding:0 12px 12px}
.job .act .btn{flex:1}
.req{display:flex;flex-direction:column;gap:5px;padding:0 12px 10px;font-size:13.5px}
.req div{display:flex;gap:8px;align-items:center}
.ok,.no{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.ok{background:var(--good);color:#0d2016}
.no{background:var(--bad);color:#2a0d06}
.bay{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.bay.on{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.bay.done{border-color:rgba(98,196,139,.6);background:var(--goodbg)}
.bay .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* ---------- parts ---------- */
.suprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px}
.suprow::-webkit-scrollbar{display:none}
.chipbtn{flex:none;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer;font-weight:650;font-size:13.5px}
.chipbtn img{width:34px;height:34px;border-radius:9px;background:var(--panel);object-fit:cover}
.chipbtn[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.prow{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px;align-items:center;min-width:0}
.prow.need{border-color:var(--good);background:var(--goodbg)}
.prow .thumb{width:56px;height:56px}
.prow .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.prow .line1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prow .buy{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px}
.stepper button{background:none;border:0;width:36px;height:36px;cursor:pointer;font-size:18px}
.stepper span{min-width:28px;text-align:center}
.prow .buy .btn{flex:1}
.plist{display:flex;flex-direction:column;gap:8px}

/* ---------- garage ---------- */
.split{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.split{grid-template-columns:200px 1fr}}
.split img{width:100%;border-radius:16px;background:var(--panel);display:block}
input[type=range]{width:100%;accent-color:var(--gold)}
.eqs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.eqs{grid-template-columns:repeat(4,1fr)}}
.eq{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.eq img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--panel);display:block}
.eq.wide img{aspect-ratio:16/9;object-fit:contain}
.eq .in{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.eq .btns{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.lock{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.lock:first-child{border-top:0}
.review{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.review:first-child{border-top:0}
.st{color:var(--gold2);letter-spacing:1px;font-size:13px}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfcac0;transition:left .15s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{left:23px;background:#1a1408}
.teasers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.teaser{position:relative;border-radius:16px;overflow:hidden;background:var(--panel)}
.teaser img{width:100%;aspect-ratio:1;object-fit:cover;display:block;opacity:.55;filter:grayscale(.4)}
.teaser span{position:absolute;left:10px;bottom:10px;right:10px;font-size:13px;font-weight:650}
textarea{width:100%;min-height:70px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px;font-family:var(--mono);font-size:11px;box-sizing:border-box}

/* ---------- sheets & toasts ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(min-width:620px){.modal{align-items:center}}
.sheet{background:var(--panel2);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92dvh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s ease-out}
@media(min-width:620px){.sheet{border-radius:24px}}
.sheet .art{background:var(--panel)} .sheet .art img{display:block;width:100%;max-height:230px;object-fit:contain}
.sheet .body{padding:18px max(18px,env(safe-area-inset-left,0px)) 20px;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.pill{align-self:flex-start;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.bad{color:var(--bad);border-color:rgba(229,125,99,.5)} .pill.good{color:var(--good);border-color:rgba(98,196,139,.5)} .pill.gold{color:var(--gold2);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:4px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(82px + env(safe-area-inset-top,0px));z-index:45;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);color:var(--fg);padding:9px 15px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:drop .25s ease-out;max-width:100%}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.energy{display:flex;align-items:center;gap:8px;padding-block:0 8px;font-size:11px;color:var(--muted)}
.ebar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s linear}
.ebar i.low{background:var(--bad)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--gold2);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.est{margin:0 12px 10px;font-size:12.5px;border-radius:10px;padding:7px 10px}
.est-ok{background:var(--goodbg);color:var(--good)}
.est-no{background:rgba(229,125,99,.1);color:var(--bad)}
.coach{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfcac0;transition:left .15s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{left:23px;background:#1a1408}
.bay{width:100%;box-sizing:border-box;color:inherit;font:inherit}
.chipbtn .chip{font-size:10.5px;padding:1px 6px}
.tab{font-size:10px}
.wherebtn{display:block;background:none;border:0;padding:0;margin-top:1px;color:var(--gold2);font:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.bizcard{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:10px;min-width:0}
.bizcard.on{border-color:var(--gold)}
.bizart{border-radius:14px;overflow:hidden;background:var(--panel);align-self:start}
.bizart img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.bizbody{min-width:0;display:flex;flex-direction:column;gap:7px}
.curbiz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
.curbiz .muted{margin-left:auto;font-size:13px}
@media(max-width:420px){.bizcard{grid-template-columns:72px 1fr}}
.tab svg{width:22px;height:22px}
.who{width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.whobtn{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;cursor:pointer;color:var(--fg)}
.whobtn img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--panel)}
.whobtn span{display:flex;flex-direction:column;min-width:0}
.whobtn small{color:var(--muted);font-size:12px}
.whobtn .num{color:var(--gold2);font-size:13px}
.whobtn:hover{border-color:var(--gold)}
.whobtn:disabled{opacity:.45;cursor:not-allowed}
.tabbar .wrap{grid-template-columns:repeat(3,1fr)}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.subtabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:9px 4px 7px;font-weight:650;font-size:12.5px;cursor:pointer}
.subtabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.subtabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold2);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}
.subtabs .badge{top:4px;left:auto;right:8px}
.lifetile.wide{grid-column:1/-1;aspect-ratio:16/7}
.wtier{margin-top:6px;display:inline-block;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:#fff}
.wtier.t2{border-color:rgba(212,166,74,.6)} .wtier.t3{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 14px rgba(212,166,74,.35)} .wtier.t4{border-color:var(--gold2);color:#fff;background:linear-gradient(90deg,rgba(212,166,74,.55),rgba(120,80,20,.55));box-shadow:0 0 22px rgba(241,208,138,.5)}
.actcard.vip{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 9%,var(--panel)),var(--panel))}

.cchip.c0{background:#5d6b7a}.cchip.c1{background:#b3262e}.cchip.c2{background:#2a6fb0}.cchip.c3{background:#1f8a4c}.cchip.c4{background:#1c1c1c}.cchip.c5{background:#7a3db0}.cchip.c6{background:linear-gradient(135deg,#d4a64a,#8a6420);color:#1a1408}

.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btnrow .btn{flex:1}
.danger{background:rgba(200,40,40,.16);border:1.5px solid #e04a3a;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;color:#ffb3a8;font-size:12.5px;margin-bottom:12px}

// ---------- helpers ----------
function rng(s){ s.seed=(s.seed+0x6D2B79F5)|0; let t=s.seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
const ri=(s,a,b)=>a+Math.floor(rng(s)*(b-a+1));
const pick=(s,arr)=>arr[Math.floor(rng(s)*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function weighted(s,items,wf){ const tot=items.reduce((t,i)=>t+wf(i),0); let r=rng(s)*tot; for(const i of items){ r-=wf(i); if(r<=0) return i; } return items[items.length-1]; }
const dayNo=t=>Math.floor(t/DAY)+1, dayStart=t=>Math.floor(t/DAY)*DAY, hourOf=t=>Math.floor((t%DAY)/60);
const weekday=t=>WEEKDAYS[Math.floor(t/DAY)%7], weekNo=t=>Math.floor(t/(DAY*7))+1;
function clock(t){ const m=t%DAY; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function when(s,at){ const d=dayNo(at)-dayNo(s.t), c=clock(at); if(d===0) return `today ${c}`; if(d===1) return `tomorrow ${c}`; if(d===-1) return `yesterday ${c}`; return `${weekday(at)} ${c}`; }
function dur(m){ m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), x=m%60; return h?`${h}h ${String(x).padStart(2,"0")}m`:`${x}m`; }
function stars(s){ const n=s.reviews.length, sum=s.reviews.reduce((t,r)=>t+r.stars,0); return (sum+3.5*5)/(n+5); }
function dirty(s){ s._dirty=true; }
function gauss(s){ const u=Math.max(1e-9,rng(s)), v=rng(s); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function workProfitPerWeek(s){ const rs=s.reports.slice(-14); if(!rs.length) return 0; const p=rs.reduce((t,r)=>t+r.revenue+(r.rent||0)-r.cogs-((r.out||{}).running||0),0); return p/rs.length*7; }
function financeRoom(s){ const used=s.finance.reduce((t,f)=>t+f.weekly,0); return Math.max(300, workProfitPerWeek(s)*0.3)-used; }
// money out is tracked in three plain groups: parts, running (running costs & bills), invest (kit, lifts, sites, marketing)
function spend(s,amt,cat){ s.today.overheads+=amt; s.stats.overheads+=amt; s.today.out=s.today.out||{running:0,invest:0}; s.today.out[cat]=(s.today.out[cat]||0)+amt; }
function addAsset(s,name,cost){ (s.assets||(s.assets=[])).push({name,cost,at:s.t}); }
function assetValue(s,a){ const days=(s.t-a.at)/DAY; return Math.round(a.cost*Math.max(0.3,1-0.01*days)); }
function toast(s,t,snd){ (s._toasts||(s._toasts=[])).push({t,snd}); }
function G(s,id){ return s.garages.find(g=>g.id===id); }
function cur(s){ return G(s,s.cur)||s.garages[0]; }
function supplier(id){ return SUPPLIERS.find(x=>x.id===id); }
function supPrice(s,sup,cat){ let p=PARTS[cat].base*sup.mult; const pr=s.promo; if(pr&&pr.sup===sup.id&&s.t<pr.until) p*=1-pr.off; if((s.empire||[]).some(b=>b.type==="distributor")) p*=.85; return Math.round(p*100)/100; }
function locCity(loc){ return LOCS[loc].city||"london"; }
function ownerHere(s,g){ return s.at===locCity(g.loc); }
function owns(s,g,id){ return !!(g.equipment[id]||s.certs[id]); }
function jobAvailable(s,g,j){ if(j.needs&&!j.needs.every(n=>owns(s,g,n))) return false; if(j.minStars&&stars(s)<j.minStars&&!g.staff.some(x=>x.role==="master")) return false; return true; }
function isOpen(s,t){ if(s.hours==="24/7") return true; const h=hourOf(t); return h>=8&&h<20; }
function isNight(t){ const h=hourOf(t); return h<7||h>=20; }
function marketingMult(s){ let m=1; for(const c of CAMPAIGNS) if(s.marketing[c.id]>s.t) m*=c.mult; return m; }
function repBonus(s){ let b=0; for(const c of CAMPAIGNS) if(c.rep&&s.marketing[c.id]>s.t) b+=c.rep; return b; }
function tolerance(s){ return (s.warranty?1.15:1)*(hasPerk(s,25)?1.05:1); }
function dailyRunning(s,g){ const l=[[s.hours==="24/7"?"Power & heating (24/7)":"Power & heating",s.hours==="24/7"?38:22],["Workshop consumables",22],["Waste oil & disposal",10],["Card & bank fees",15]]; if(g.equipment.waiting) l.push(["Waiting room coffee & Wi-Fi",6]); return l; }
function garageArt(g){ if(g.loc!=="croydon") return LOCS[g.loc].art; const t=g.equipment.tyre, p=g.equipment.paint; return t&&p?"garage_full":t?"garage_tyre":p?"garage_paint":"garage_inside"; }
function partsSell(s,j){ let t=0; for(const [c,q] of Object.entries(j.parts)) t+=PARTS[c].base*q*(1+s.markup); return t+(j.consumable||0); }
function priceParts(s,j,urgent,night){ if(j.fixed) return {labour:j.fixed,parts:0,total:j.fixed}; const lab=s.rate*j.hrs*(urgent?1.2:1)*(night?1.3:1), parts=partsSell(s,j); return {labour:Math.round(lab),parts:Math.round(parts),total:Math.round(lab)+Math.round(parts)}; }
function fairPrice(s,g,j,tier){ if(j.fixed) return j.fixed; const L=LOCS[g.loc]; return tolerance(s)*(L.market*j.hrs+Object.entries(j.parts).reduce((t,[c,q])=>t+PARTS[c].base*q*1.35,0)+(j.consumable||0))*TIER_PAY[tier]; }
function stockCount(s,cat){ return s.stock.filter(b=>b.cat===cat).reduce((t,b)=>t+b.qty,0); }
function onOrder(s,cat){ return s.orders.filter(o=>o.cat===cat).reduce((t,o)=>t+o.qty,0); }
function stdMins(j){ return Math.round(j.hrs*60); }
function allJobs(s){ return s.garages.flatMap(g=>g.jobs.map(j=>({g,j}))); }
function hasRole(g,r){ return g.staff.some(x=>x.role===r); }
function managed(g){ return !!g.franchise || hasRole(g,"manager"); }

// ---------- workers & capacity ----------
function techs(g){ return g.staff.filter(x=>ROLES[x.role].tech); }
function ownerBusy(s){ return allJobs(s).some(({j})=>j.status==="working"&&(j.worker==="owner"||j.helper==="owner")); }
function workerBusy(g,id){ return g.jobs.some(j=>j.status==="working"&&(j.worker===id||(j.crew||[]).includes(id))); }
function freeTechs(g){ return techs(g).filter(x=>!workerBusy(g,x.id)); }
function baysUsed(g){ return g.jobs.filter(j=>j.status==="working"||j.status==="done").length; }
function bayFree(g){ return baysUsed(g)<g.bays; }
const MIN_JOB_MINS = 22.5; // no crew size can finish a job faster than this
function staffSpeed(g,id,job,t){ if(id==="owner") return 1; const st=g.staff.find(x=>x.id===id); if(!st) return 0; const T=trait(st); let v=ROLES[st.role].speed*(st.skill||1)*(T.spd||1);
  if(job){ const J=JOB[job.job]; if(T.ev&&J&&(J.needs||[]).includes("ev")) v*=T.ev; if(T.big&&J&&J.hrs>=3) v*=T.big; }
  if(T.night&&t!=null){ const h=Math.floor((t%1440)/60); if(h>=20||h<7) v*=T.night; } return v; }
const CREW_WEIGHTS=[0.7,0.5,0.35,0.25,0.2]; // each extra pair of hands adds less: they get in each other's way
function crewWeight(i){ return CREW_WEIGHTS[i]??0.15; }
function rawSpeed(s,g,job){ const extra=(job.crew||[]).map(id=>staffSpeed(g,id,job,s.t)).sort((x,y)=>y-x); let r=staffSpeed(g,job.worker,job,s.t)+extra.reduce((t,v,i)=>t+v*crewWeight(i),0); r*=g.equipment.impact?1/0.9:1; if(job.boost&&s.energy>0) r=r/FLAT_OUT; return r; }
function speedCap(job){ return Math.max(1,(job.workTotal||60)/MIN_JOB_MINS); }
function workerSpeed(s,g,job){ return Math.min(rawSpeed(s,g,job),speedCap(job)); }
function atCap(s,g,job){ return rawSpeed(s,g,job)>=speedCap(job)-1e-9; }
function addCrew(s,gid,jid,sid){ const g=G(s,gid); const q=g&&g.jobs.find(x=>x.id===jid); if(!q||q.status!=="working") return {ok:false};
  const st=g.staff.find(x=>x.id===sid); if(!st||!ROLES[st.role].tech) return {ok:false}; if(workerBusy(g,sid)) return {ok:false,msg:`${st.name} is busy.`};
  if(atCap(s,g,q)) return {ok:false,msg:`It can't go any faster — ${MIN_JOB_MINS} minutes is the minimum for any job.`};
  (q.crew||(q.crew=[])).push(sid); dirty(s); return {ok:true,name:st.name}; }
function removeCrew(s,gid,jid,sid){ const g=G(s,gid); const q=g&&g.jobs.find(x=>x.id===jid); if(!q) return; q.crew=(q.crew||[]).filter(x=>x!==sid); dirty(s); }
function jobRemaining(s,g,job){ return job.workLeft/workerSpeed(s,g,job); }
function capacity(s,g){ return Math.max(1,Math.min(g.bays,techs(g).length+1)); }
function estimate(s,g,e){ // when could this enquiry start and finish?
  const j=JOB[e.job]; const cap=capacity(s,g);
  const working=g.jobs.filter(x=>x.status==="working").reduce((t,x)=>t+jobRemaining(s,g,x),0);
  const waiting=g.jobs.filter(x=>x.status==="waiting").reduce((t,x)=>t+(x.workLeft||stdMins(JOB[x.job])),0);
  let start=s.t+(working+waiting)/cap;
  for(const [c,n] of Object.entries(j.parts)){ if(stockCount(s,c)<n){ const inc=s.orders.filter(o=>o.cat===c).sort((a,b)=>a.at-b.at)[0]; start=Math.max(start, inc?inc.at:s.t+120); } }
  if(!isOpen(s,start)) start=dayStart(start)+(hourOf(start)>=20?DAY:0)+8*60;
  const finish=start+stdMins(j); return {start:Math.round(start),finish:Math.round(finish),fits:finish<=e.dueAt};
}

function cityOf(g){ return locCity(g.loc); }
function makeCandidate(s,g,role){ const R=ROLES[role], city=cityOf(g);
  const used=new Set(s.garages.flatMap(x=>[...x.staff.map(y=>y.name),...Object.values(x.cands||{}).flat().map(y=>y.name)]));
  const pool=LOCAL_NAMES[city]||LOCAL_NAMES.london; const name=pool.find(n=>!used.has(n)&&rng(s)<.5)||pool.find(n=>!used.has(n))||`${pick(s,pool).split(" ")[0]} ${String.fromCharCode(65+ri(s,0,25))}.`;
  const skill=R.tech?Math.round(clamp(1+gauss(s)*.12,.75,1.3)*100)/100:1;
  const tl=Object.entries(TRAITS).filter(([k,t])=>R.tech||!t.tech).map(([k])=>k); const trait=pick(s,tl);
  const age=role==="apprentice"?ri(s,16,21):ri(s,22,61); const yrs=Math.max(0,age-(role==="apprentice"?16:18)-ri(s,0,4));
  const wage=R.wage?Math.round(R.wage*(CITY_WAGE[city]||1)*(R.tech?Math.pow(skill,1.6):1)*(0.92+rng(s)*.16)/10)*10:0;
  return {id:"c"+(s.nextId++),role,name,skill,trait,age,yrs,wage}; }
function candidates(s,g,role){ g.cands=g.cands||{}; const c=g.cands[role]||(g.cands[role]=[]); while(c.length<3) c.push(makeCandidate(s,g,role)); return c; }
function staffWage(st){ return st.wage!=null?st.wage:ROLES[st.role].wage; }
function staffFix(s){ for(const g of s.garages) for(const st of g.staff) if(st.skill==null){ const c=makeCandidate(s,g,st.role); st.skill=c.skill; st.trait=c.trait; st.age=c.age; st.yrs=c.yrs; st.wage=ROLES[st.role].wage; } }
function trait(st){ return st&&TRAITS[st.trait]||{}; }

  const total=Math.round(unit*qty*100)/100;
  if(!sup.account){ if(s.cash<total) return {ok:false,msg:`Not enough cash — ${sup.short} wants paying up front.`}; s.cash-=total; } else s.owedSuppliers+=total;
  if(s.vat.registered) s.vat.input+=total/6;
  const at=arrivalTime(s,sup); s.orders.push({cat,qty,unit,q:sup.quality,sup:sup.id,at}); dirty(s);
  return {ok:true,total,msg:`${qty} × ${PARTS[cat].name} from ${sup.short} — arriving ${when(s,at)}.`};
}
function takeStock(s,cat,n){ let cost=0,minQ=1,oem=false; while(n>0){ const b=s.stock.find(x=>x.cat===cat&&x.qty>0); if(!b) break; const k=Math.min(n,b.qty); b.qty-=k; n-=k; cost+=k*b.unit; minQ=Math.min(minQ,b.q); if(b.oem) oem=true; } s.stock=s.stock.filter(b=>b.qty>0); return {cost,minQ,oem}; }

// ---------- jobs ----------
function canStart(s,g,q){ const miss=jobMissing(s,q); return {bayFree:bayFree(g), parts:!Object.keys(miss).length, miss, tech:freeTechs(g)[0]||null, owner:!ownerBusy(s)&&ownerHere(s,g)&&!onHoliday(s)}; }
function startJob(s,gid,id,who,flatOut){ // who: "owner" | staff id | "auto"
  const g=G(s,gid); const q=g.jobs.find(x=>x.id===id); if(!q||q.status!=="waiting") return {ok:false};
  const c=canStart(s,g,q);
  if(!c.bayFree) return {ok:false,msg:`All ${g.bays} bay${g.bays>1?"s are":" is"} busy.`}; if(!c.parts) return {ok:false,msg:"You're missing parts for this job."};
  if(who==="auto") who=c.tech?c.tech.id:(c.owner?"owner":null);
  if(!who) return {ok:false,msg:"Nobody's free to do it."};
  if(who==="owner"&&!c.owner) return {ok:false,msg:ownerHere(s,g)?"You're already working on another job.":`You're in ${s.at==="air"?"the air":CITIES[s.at].name} — you can only work on cars where you are.`};
  if(who!=="owner"&&workerBusy(g,who)) return {ok:false,msg:"They're busy on another car."};
  const j=JOB[q.job]; let cost=j.consumable||0,minQ=1,oem=false;
  for(const [cat,n] of Object.entries(j.parts)){ const r=takeStock(s,cat,n); cost+=r.cost; minQ=Math.min(minQ,r.minQ); oem=oem||r.oem; }
  const st=g.staff.find(x=>x.id===who); const staffQ=st?(ROLES[st.role].quality||0)+(trait(st).q||0)+((st.skill||1)-1)*.05:0;
  Object.assign(q,{status:"working", startAt:s.t, worker:who, boost:false, crew:[], partsCost:cost, minQ:Math.min(1,minQ+staffQ), oem});
  if(s.tut===1||s.tut===2) s.tut=3;

}
function jumpIn(s,gid,id){ return {ok:false,msg:"Boosting has been removed."};
  const g=G(s,gid); const q=g.jobs.find(x=>x.id===id); if(!q||q.status!=="working"||q.boost) return {ok:false};
  if(s.energy<=3) return {ok:false,msg:"You're out of energy. Rest up first."};
  if(!ownerHere(s,g)) return {ok:false,msg:"You're not in this city."};
  if(q.worker==="owner") return {ok:false,msg:"You're already doing this job yourself."};
  if(ownerBusy(s)) return {ok:false,msg:"You're already working on another job."};
  if(atCap(s,g,q)) return {ok:false,msg:`It can't go any faster — ${MIN_JOB_MINS} minutes is the minimum for any job.`};
  q.helper="owner"; q.boost=true; dirty(s); return {ok:true};
}
function stepBack(s,gid,id){ const q=G(s,gid).jobs.find(x=>x.id===id); if(q){ q.boost=false; if(q.helper==="owner") q.helper=null; dirty(s); } }
function completeJob(s,gid,id){
  const g=G(s,gid); const q=g.jobs.find(x=>x.id===id); if(!q||q.status!=="done") return null;
  g.jobs=g.jobs.filter(x=>x!==q);
  const j=JOB[q.job]; const res={job:q,g:g.id,review:null,tip:0,cut:0};
  if(q.comeback){ s.today.cogs+=q.partsCost||0; s.stats.cogs+=q.partsCost||0; s.log.unshift({t:s.t,x:`Comeback fixed for ${q.cust}. No charge.`}); dirty(s); return res; }
  s.cash+=q.price; s.today.revenue+=q.price; s.today.cogs+=q.partsCost; s.today.jobs++; g.today.revenue+=q.price; g.today.jobs++;
  s.stats.revenue+=q.price; s.stats.cogs+=q.partsCost; s.stats.jobsDone++; g.stats.jobsDone++; g.stats.revenue+=q.price;
  if(s.vat.registered&&["london","manchester"].includes(locCity(g.loc))) s.vat.output+=q.price/6;
  const st=g.staff.find(x=>x.id===q.worker); if(st&&ROLES[st.role].cut){ res.cut=Math.round(q.labour*ROLES[st.role].cut); s.cash-=res.cut; spend(s,res.cut,"running"); }
  const ratio=q.price/(fairPrice(s,g,j,q.tier)*(q.urgent?1.2:1));
  const lateDays=Math.max(0,(s.t-q.dueAt)/DAY);
  let score=4.55+clamp((1-ratio)*2.6,-3,0.45)-lateDays*1.2+(q.oem?.3:0)+(rng(s)*1.2-.6)+(g.equipment.waiting?.25:0)+(g.equipment.courtesy&&j.hrs>=2?.35:0)+repBonus(s)+(q.collect?.15:0)+g.staff.reduce((t,x)=>t+(x.role==='receptionist'||x.id===q.worker?(trait(x).rev||0):0),0);
  const back=Object.keys(j.parts).length>0&&rng(s)<(1-q.minQ)*0.65;
  if(back){ s.pending.push({g:g.id, at:s.t+ri(s,2,5)*DAY+ri(s,8,17)*60, job:{job:q.job,car:q.car,cust:q.cust,tier:q.tier}}); }
  if(score>=4.5&&rng(s)<0.15){ res.tip=ri(s,1,4)*5; s.cash+=res.tip; s.today.revenue+=res.tip; }
  if(rng(s)<0.6||back) res.review=makeReview(s,q,back?Math.min(score,2):score);
  if(j.id==="mot"&&rng(s)<0.4){ const fix=pick(s,["brakesF","bulbs","susp","exhaust","brakesF","bulbs"].concat(g.equipment.tyre?["tyres","tyres"]:[]));
    const e=genEnquiry(s,g,{job:fix,tier:q.tier},false); e.car=q.car; e.cust=q.cust; e.expiresAt=s.t+6*60; e.motFail=true; g.board.push(e); res.motFail=JOB[fix].name;
    if(!managed(g)) toast(s,`${q.cust}'s car failed its MOT — they want you to fix it`,"ping"); }
  s.log.unshift({t:s.t,x:`${s.garages.length>1?g.name+": ":""}${j.name} for ${q.cust} complete. +£${Math.round(q.price)}${res.tip?` and a £${res.tip} tip`:""}.`});
  if(s.tut===3) s.tut=4;

}
function makeReview(s,q,score,text){ const st=clamp(Math.round(score),1,5); const r={stars:st,name:q.cust,car:q.car,job:JOB[q.job].name,text:text||pick(s,REVIEW_TEXT[st]),t:s.t}; s.reviews.unshift(r); if(s.reviews.length>40) s.reviews.pop(); return r; }

function payBill(s,id){
  const b=s.inbox.find(p=>p.id===id); if(!b) return;

// ---------- buying, staff, garages, loans ----------

function buyCert(s,id){ const c=CERTS.find(x=>x.id===id); if(!c||s.certs[id]) return {ok:false}; if(s.cash<c.price) return {ok:false,msg:"Not enough cash."}; s.cash-=c.price; spend(s,c.price,"invest"); s.certs[id]=true; s.log.unshift({t:s.t,x:`Qualified: ${c.name}.`}); dirty(s); return {ok:true}; }
function runCampaign(s,id){ const c=CAMPAIGNS.find(x=>x.id===id); if(!c) return {ok:false}; if(s.marketing[id]>s.t) return {ok:false,msg:"Already running."}; if(s.cash<c.cost) return {ok:false,msg:"Not enough cash."}; s.cash-=c.cost; spend(s,c.cost,"invest"); s.marketing[id]=s.t+c.days*DAY; s.log.unshift({t:s.t,x:`Marketing: ${c.name} for ${c.days} days.`}); dirty(s); return {ok:true}; }

  const st={id:"st"+(s.nextId++), role, name:c.name, since:s.t, skill:c.skill, trait:c.trait, age:c.age, yrs:c.yrs, wage:c.wage}; g.staff.push(st); const name=st.name;

function fire(s,gid,sid){ const g=G(s,gid); const st=g.staff.find(x=>x.id===sid); if(!st) return {ok:false}; if(workerBusy(g,sid)) return {ok:false,msg:`${st.name} is mid-job. Let them finish first.`};

function siteCost(loc){ return LOCS[loc].deposit+NEW_SITE_FITOUT; }

function franchiseValue(s,g){ return Math.round(Math.max(25000, g.stats.revenue*0.25+g.bays*6000+Object.keys(g.equipment).length*2500)/500)*500; }
// a new owner takes the jobs on: they pay you for finished cars, the rest go with the garage
function handOverJobs(s,g){ let cash=0; const n=g.jobs.length; for(const q of g.jobs) if(q.status==="done"&&!q.comeback) cash+=q.price; g.jobs=[]; g.board=[]; s.pending=s.pending.filter(p=>p.g!==g.id); return {n,cash:Math.round(cash)}; }

}
function loanOffer(l){ const total=l.amount*(1+LOAN_APR*l.weeks/52); return {...l,total:Math.round(total),weekly:Math.round(total/l.weeks)}; }

function takeLoan(s,id){ const l=LOANS.find(x=>x.id===id); if(!l) return {ok:false}; const c=loanCheck(s,l); if(!c.ok) return {ok:false,msg:c.reason};

// ---------- property ----------
function genListings(s){ s.listings=[]; const city=s.at==="air"?"london":s.at; s.listingsCity=city; const pool=PROPERTY_TYPES.filter(x=>(x.city||"london")===city);

function propType(p){ return PROPERTY_TYPES.find(x=>x.id===p.type); }
const RENT_MULT=3; // game years are short, so rents are scaled up to give a sensible yield
function propRent(p){ const T=propType(p); return T?Math.round(T.rent*RENT_MULT*(p.rentMult||1)):0; }
function buyProperty(s,lid,mortgage){

  s.cash-=cash; spend(s,fees,"invest"); s.listings=s.listings.filter(x=>x!==L);
  const pr={id:s.nextId++,type:T.id,name:T.name,area:T.area,paid:L.price,value:L.price,mortgage:loan,mode:"empty",tenantFrom:0,renoUntil:0,rentMult:1,bought:s.t};
  s.props.push(pr); s.log.unshift({t:s.t,x:`Bought a ${T.name.toLowerCase()} in ${T.area} for £${L.price.toLocaleString("en-GB")}${loan?` with a £${loan.toLocaleString("en-GB")} mortgage`:""}.`}); checkMilestones(s); dirty(s); return {ok:true,p:pr};
}
function setPropMode(s,pid,mode){

  if(mode==="airbnb"&&!p.furnished){ const cost=Math.round(p.value*0.02); if(s.cash<cost) return {ok:false,msg:`Furnishing for holiday lets costs £${cost.toLocaleString("en-GB")}.`}; s.cash-=cost; spend(s,cost,"invest"); p.furnished=true; }

}
function renovate(s,pid){ const p=s.props.find(x=>x.id===pid); if(!p||p.type==="freehold"||p.renoUntil>s.t) return {ok:false}; const cost=Math.round(p.value*0.12);

function sellProperty(s,pid){ const p=s.props.find(x=>x.id===pid); if(!p) return {ok:false}; if(p.type==="freehold"){ const g=G(s,p.gid); if(g&&!g.franchise) return {ok:false,msg:"Your garage is trading from this unit. You'd need to keep it."}; }

function freeholdPrice(g){ return Math.round(LOCS[g.loc].rent*52*12/5000)*5000; }
function buyFreehold(s,gid,mortgage){
  const g=G(s,gid); if(!g||s.props.some(p=>p.type==="freehold"&&p.gid===gid)) return {ok:false};
  const price=freeholdPrice(g), fees=Math.round(price*PROP_FEES), loan=mortgage?Math.round(price*MORTGAGE_LTV):0, cash=price-loan+fees;
  if(mortgage&&health(s).score<55) return {ok:false,msg:"The bank wants a health score of 55+ for a mortgage."};

// ---------- travel & jets ----------
function jetFor(s,to){ const mins=flightMins(s.at,to); return (s.jets||[]).map(id=>JETS.find(j=>j.id===id)).filter(j=>j&&mins<=j.range).sort((a,b)=>a.speed-b.speed)[0]||null; }
function travel(s,to,mode){
  if(s.at==="air") return {ok:false,msg:"You're already in the air."}; if(s.at===to) return {ok:false};
  const mins=Math.round(flightMins(s.at,to)*(1-[0,.1,.15,.2][(s.mansion&&s.mansion.rooms.heli)||0])); let cost=0, time=mins;
  if(mode==="jet"){ const j=jetFor(s,to); if(!j) return {ok:false,msg:"None of your jets can fly that far."}; cost=j.perFlight*(s.charter?2:1); time=Math.round(mins*j.speed); }
  else cost=ticketCost(s.at,to)*(mode==="business"?3:1);
  if(s.cash<cost) return {ok:false,msg:"Not enough cash."};
  s.cash-=cost; spend(s,cost,"running");
  if(ownerBusy(s)) for(const {j} of allJobs(s)) if(j.helper==="owner"||(j.worker==="owner"&&j.boost)){ j.boost=false; if(j.helper==="owner") j.helper=null; }
  s.travel={from:s.at,to,depart:s.t,arriveAt:s.t+time,mode}; s.at="air";
  s.log.unshift({t:s.t,x:`Flying ${mode==="jet"?"by private jet":mode==="business"?"business class":"economy"} to ${CITIES[to].name}.`}); dirty(s); return {ok:true,time};
}
function landed(s){ const tr=s.travel; s.at=tr.to; s.travel=null; if(tr.mode==="economy") s.energy=Math.max(0,s.energy-20); else s.energy=Math.min(100,s.energy+(tr.mode==="jet"?25:10));
  s.visited=s.visited||{}; const first=!s.visited[tr.to]; s.visited[tr.to]=true; genListings(s);
  if(first&&tr.to!=="london") addInfo(s,`Welcome to ${CITIES[tr.to].name}`,`You can open a garage here, buy property and take a holiday. Your other businesses keep running while you're away.`,"good");
  toast(s,`Landed in ${CITIES[tr.to].name}`,"done"); dirty(s); }
function buyJet(s,id){ const J=JETS.find(x=>x.id===id); s.jets=s.jets||[]; if(!J||s.jets.includes(id)) return {ok:false}; if(s.cash<J.price) return {ok:false,msg:"Not enough cash."};
  s.cash-=J.price; spend(s,J.price,"invest"); luxRebate(s,J.price,"jet"); addAsset(s,J.name,J.price); s.jets.push(id); s.log.unshift({t:s.t,x:`Bought a ${J.name.toLowerCase()}. Welcome to the private terminal.`}); checkMilestones(s); dirty(s); return {ok:true}; }
function holiday(s,days){ if(s.at==="air") return {ok:false}; const cost=CITIES[s.at].holiday*days; if(s.cash<cost) return {ok:false,msg:"Not enough cash."};
  s.cash-=cost; spend(s,cost,"running"); s.energy=100; gainFame(s,4*days); s.holidayUntil=s.t+days*DAY; s.log.unshift({t:s.t,x:`Took a ${days}-day break in ${CITIES[s.at].name}.`}); dirty(s); return {ok:true}; }
function onHoliday(s){ return s.holidayUntil>s.t; }

// ---------- investments ----------
function invPrice(s,id){ return s.prices[id]??100; }
function invValue(s,id){ const h=s.hold[id]; if(!h) return 0; return id==="bonds"?h.units:h.units*invPrice(s,id); }
function buyInvest(s,id,amt){ const I=INVEST.find(x=>x.id===id); if(!I||amt<=0) return {ok:false};
  if(s.cash<amt) return {ok:false,msg:"Not enough cash."}; if(I.max&&invValue(s,id)+amt>I.max) return {ok:false,msg:`The most you can hold is £${I.max.toLocaleString("en-GB")}.`};
  const h=s.hold[id]||(s.hold[id]={units:0,cost:0}); h.units+=id==="bonds"?amt:amt/invPrice(s,id); h.cost+=amt; s.cash-=amt; dirty(s); return {ok:true}; }
function sellInvest(s,id,frac){ const h=s.hold[id]; if(!h||h.units<=0) return {ok:false}; const v=invValue(s,id)*frac; h.units*=1-frac; h.cost*=1-frac; s.cash+=v; if(h.units<1e-9) delete s.hold[id]; dirty(s); return {ok:true,v}; }
function investDaily(s){
  let shock=0; const r=rng(s); if(r<0.012) shock=-1; else if(r<0.022) shock=1;
  for(const I of INVEST){ if(I.id==="bonds") continue; let p=invPrice(s,I.id);
    const shockMove = shock?({index:.12,tech:.22,crypto:.38,gold:-.05}[I.id]||0)*shock:0;
    p*=Math.exp(I.ann/60-I.vol*I.vol/2+I.vol*gauss(s))*(1+shockMove); s.prices[I.id]=p;
    const hst=s.priceHist[I.id]||(s.priceHist[I.id]=[]); hst.push(Math.round(p*100)/100); if(hst.length>30) hst.shift(); }
  if(shock) addInfo(s,shock<0?"Markets tumble":"Markets rally",shock<0?"Share prices fell sharply today. Tech and crypto took the biggest hit — gold held up.":"Investors piled in. Shares, tech and crypto jumped today.",shock<0?"bad":"good");
}
function bondsDraw(s){ const h=s.hold.bonds; if(!h||h.units<100) return; let win=Math.round(h.units*0.044*7/60*(0.2+rng(s)*1.6)/25)*25;
  if(rng(s)<h.units/50000*0.004){ win+=100000; addInfo(s,"Premium Bonds jackpot!","One of your bonds came up — you've won £100,000!","good"); }
  if(win>0){ s.cash+=win; s.today.rent=(s.today.rent||0)+win; toast(s,`Premium Bonds: you won £${win.toLocaleString("en-GB")}`,"cash"); } }
function investTotal(s){ return INVEST.reduce((t,I)=>t+invValue(s,I.id),0); }

// ---------- health ----------
function weeklyFixed(s){ let w=0; for(const g of s.garages) if(!g.franchise){ const L=LOCS[g.loc]; w+=L.rent+L.rates+L.utils+L.ins+dailyRunning(s,g).reduce((t,l)=>t+l[1],0)*7+g.staff.reduce((t,x)=>t+staffWage(x),0); } return w+s.loans.reduce((t,l)=>t+l.weekly,0); }
function health(s){
  const weekly=weeklyFixed(s);
  const unpaid=s.inbox.filter(p=>p.type==="bill").reduce((t,b)=>t+b.amount,0);
  const debt=s.owedSuppliers+unpaid+s.finance.reduce((t,f)=>t+f.weekly*f.left,0)+s.loans.reduce((t,l)=>t+l.weekly*l.left,0)+Math.max(0,-s.cash)+(s.vat.registered?Math.max(0,s.vat.output-s.vat.input):0);
  const common=["oil","svc","brakes","bulbs","battery"]; const stocked=common.filter(c=>stockCount(s,c)>=2).length/common.length; const short=Object.keys(partsNeeded(s).short).length;
  const parts=[
    {id:"cash",name:"Cash",score:clamp(s.cash/(weekly*3),0,1),label:`${Math.max(0,s.cash/weekly).toFixed(1)} weeks of costs`},
    {id:"rating",name:"Reputation",score:clamp((stars(s)-2.5)/2,0,1),label:`${stars(s).toFixed(2)}★ from ${s.reviews.length} reviews`},
    {id:"stock",name:"Stock",score:clamp(stocked-short*.15,0,1),label:short?`${short} part${short>1?"s":""} short for jobs`:`${Math.round(stocked*100)}% of common parts stocked`},
    {id:"debt",name:"Debts",score:clamp(1-debt/(weekly*6),0,1),label:debt>0?`£${Math.round(debt).toLocaleString("en-GB")} owed`:"Nothing owed"},
  ];
  const score=Math.round((parts[0].score*.35+parts[1].score*.25+parts[2].score*.15+parts[3].score*.25)*100);
  return {score,grade:score>=92?"A+":score>=85?"A":score>=70?"B":score>=55?"C":score>=40?"D":"E",parts};
}

// ---------- automation (managers, receptionists) & franchises ----------
function autoRun(s,g){
  if(g.franchise) return;
  const full=hasRole(g,"manager");
  if(full) for(const q of g.jobs.filter(x=>x.status==="done")) completeJob(s,g.id,q.id);
  if(full||hasRole(g,"receptionist")){
    for(const e of [...g.board]){ if(g.jobs.filter(x=>x.status==="waiting").length>=g.bays*3) break; if(estimate(s,g,e).fits) accept(s,g.id,e.id); }
  }
  if(full){
    const need={}; for(const q of g.jobs) if(q.status==="waiting") for(const [c,n] of Object.entries(JOB[q.job].parts)) need[c]=(need[c]||0)+n;
    for(const c in need){ const k=need[c]-stockCount(s,c)-onOrder(s,c); if(k>0) { const n0=s.orders.length; orderParts(s,c==="tyre"?"tyrehub":"partsdirect",c,k); for(let i=n0;i<s.orders.length;i++) s.orders[i].auto=true; } }
    for(const q of g.jobs.filter(x=>x.status==="waiting")){ const c=canStart(s,g,q); if(!c.bayFree) break; if(c.parts&&c.tech) startJob(s,g.id,q.id,c.tech.id); }
    // the manager won't let customers walk out: anything that can't be finished on time goes to a mate for the 10% referral
    for(const q of g.jobs.filter(x=>x.status==="waiting"&&!x.comeback)) if(s.t+stdMins(JOB[q.job])>q.dueAt) passOn(s,g.id,q.id);
  }
}

function mgrIdeas(s,g){ const L=LOCS[g.loc], out=[]; const eq=k=>g.equipment[k];

  if(!eq("impact")) out.push({id:"impact",name:"Cordless impact gun set",cost:480,why:"Every job would be 10% quicker."});
  if(!eq("scanner")) out.push({id:"scanner",name:"Diagnostic scanner",cost:1450,why:"We keep getting warning-light cars we can't take."});
  if(!eq("motbay")) out.push({id:"mot",name:`MOT setup (test bay${s.certs.motcert?"":" + tester licence"})`,cost:8500+(s.certs.motcert?0:1800),why:"MOTs bring steady work, and failed cars book repairs with us."});
  if(!eq("tyre")) out.push({id:"tyre",name:"Tyre changer & balancer",cost:3200,why:"Tyre jobs are easy money we're missing."});

  if(!eq("aircon")) out.push({id:"aircon",name:`Air-con station${s.certs.fgas?"":" + F-gas licence"}`,cost:2600+(s.certs.fgas?0:600),why:"Air-con regas is quick, high-margin work."});
  if(!eq("van")) out.push({id:"van",name:"Garage van",cost:9000,why:"Collection & delivery: about 12% more enquiries."});
  if(!eq("paint")) out.push({id:"paint",name:"Spray paint booth",cost:6500,why:"Unlocks bodywork and paint jobs — big tickets."});
  if(!eq("courtesy")) out.push({id:"courtesy",name:"Courtesy car",cost:6000,why:"Lets us win more premium customers."});
  return out; }
function doUpgrade(s,g,id){ if(id==="lift") return buyLift(s,g.id,false); if(id==="hire") return hire(s,g.id,"mechanic");
  if(id==="mot"){ if(!s.certs.motcert){ const r=buyCert(s,"motcert"); if(!r.ok) return r; } return buyKit(s,g.id,"motbay",false); }
  if(id==="aircon"){ if(!s.certs.fgas){ const r=buyCert(s,"fgas"); if(!r.ok) return r; } return buyKit(s,g.id,"aircon",false); }
  return buyKit(s,g.id,id,false); }
function mgrAsk(s){
  for(const g of s.garages){ if(g.franchise||!hasRole(g,"manager")) continue;
    if(s.inbox.some(p=>p.type==="ask"&&p.gid===g.id)||(g.askAfter||0)>s.t) continue;
    const idea=mgrIdeas(s,g).find(x=>s.cash>=x.cost*3&&!(((g.declined||{})[x.id]||0)>s.t)); if(!idea) continue;
    s.inbox.push({id:s.nextId++,type:"ask",gid:g.id,idea,showAt:s.t}); g.askAfter=s.t+2*DAY; dirty(s); }
}
function answerAsk(s,pid,yes){ const p=s.inbox.find(x=>x.id===pid); if(!p) return {ok:false}; s.inbox=s.inbox.filter(x=>x!==p); const g=G(s,p.gid); if(!g) return {ok:false};
  if(!yes){ g.declined=g.declined||{}; g.declined[p.idea.id]=s.t+7*DAY; dirty(s); return {ok:true}; }
  const r=doUpgrade(s,g,p.idea.id); if(r&&r.ok!==false) s.log.unshift({t:s.t,x:`${g.name}: you approved ${p.idea.name.toLowerCase()}.`}); dirty(s); return r||{ok:true}; }
function franchiseUpgrade(s,g){ if(rng(s)>0.06) return; const L=LOCS[g.loc]; const opts=[]; if(g.bays<L.maxBays) opts.push("lift"); for(const e of [...EQUIPMENT,...FACILITIES]) if(!g.equipment[e.id]) opts.push(e.id); if(!opts.length) return;
  const k=pick(s,opts); if(k==="lift") g.bays++; else g.equipment[k]=true; s.log.unshift({t:s.t,x:`${g.name} (franchise): the franchisee invested in ${k==="lift"?"another lift":[...EQUIPMENT,...FACILITIES].find(e=>e.id===k).name.toLowerCase()}. Your 10% grows with them.`}); }
function franchiseDay(s,g){
  franchiseUpgrade(s,g);
  const turnover=Math.round(dailyDemand(s,g)*185*(0.8+rng(s)*0.4)*Math.max(1,g.bays*0.8));

// ---------- the clock ----------
function nightFF(s){ const h=hourOf(s.t); if(!(h>=21||h<7)) return false; return !allJobs(s).some(({g,j})=>!managed(g)&&(j.status==="working"||j.status==="done"||(j.status==="waiting"&&canStart(s,g,j).parts))) && !s.garages.some(g=>!managed(g)&&g.board.length); }
function advance(s,minutes,opts){
  const ignore=opts&&opts.ignorePopups;
  for(let k=0;k<minutes;k++){
    if(!ignore&&currentPopup(s)) return;
    s.t++;
    const h=hourOf(s.t), m=s.t%60, open=isOpen(s,s.t);
    if(s.travel&&s.t>=s.travel.arriveAt) landed(s);
    if(s.club&&s.club.cup&&s.club.cup.alive&&s.club.cup.at&&s.t>=s.club.cup.at){ const r=playCup(s); if(r) toast(s,`Cup: ${s.club.name} ${r.gf}–${r.ga} ${r.opp} · ${r.msg}`,r.res==="W"?"cash":"ping"); }
    if(s.book&&s.book.games.length&&s.t%15===0) bookTick(s);
    if(s.t%30===0) coinTick(s);
    if(s.t%5===0){ mktTick(s); if(s.law&&s.law.tip) lawTip(s); }
    if(s.club&&s.club.fixture&&s.t>=s.club.fixture.at){ const r=playMatch(s); if(r) toast(s,`${s.club?s.club.name:"FC"} ${r.gf}–${r.ga} ${r.opp} · ${r.res==="W"?"Win!":r.res==="D"?"Draw":"Loss"}`,r.res==="W"?"cash":"ping"); }
    if(open&&!(s.burstUntil>s.t)&&h>=7&&h<21&&rng(s)<1.6/(14*60)){ s.burstUntil=s.t+ri(s,20,40); for(const g of s.garages.filter(x=>!x.franchise)){ const n=ri(s,1,2); for(let i=0;i<n;i++) g.board.push(genEnquiry(s,g)); } dirty(s); if(s.garages.some(x=>!managed(x))) toast(s,"Rush on! The phones are ringing","rush"); }
    let onTools=false;
    for(const g of s.garages){ if(g.franchise) continue;
      const p=open?dailyDemand(s,g)*CURVE[h]/CURVE_SUM/60*(s.burstUntil>s.t?3:1):0;
      if(rng(s)<p){ g.board.push(genEnquiry(s,g)); dirty(s); if(!managed(g)) toast(s,`New enquiry${s.garages.length>1?` at ${g.name}`:""}`,"ping"); }
      // only top up an empty board when you're actually idle: a bay free and nothing ready to start
      const idle=bayFree(g)&&!g.jobs.some(q=>q.status==="waiting"&&!Object.keys(jobMissing(s,q)).length);
      if(open&&h>=7&&h<21&&!g.board.length&&idle){ g.emptySince=g.emptySince||s.t; if(s.t-g.emptySince>=(g.refillAfter||(g.refillAfter=ri(s,20,40)))){ g.refillAfter=0; g.board.push(genEnquiry(s,g)); g.emptySince=0; dirty(s); } } else g.emptySince=0;
      const before=g.board.length; g.board=g.board.filter(e=>e.expiresAt>s.t); if(g.board.length!==before) dirty(s);
      if(open) for(const q of g.jobs) if(q.status==="working"){
        if(q.worker==="owner"||q.helper==="owner") onTools=true;
        q.workLeft-=workerSpeed(s,g,q);
        if(q.boost){ s.energy-=0.45; if(s.energy<=0){ s.energy=0; q.boost=false; if(q.helper==="owner") q.helper=null; toast(s,"You're out of energy — you've stopped helping and the job carries on at normal speed","buzz"); dirty(s); } }
        if(q.workLeft<=0){ q.workLeft=0; q.status="done"; q.doneAt=s.t; q.boost=false; if(q.helper==="owner") q.helper=null; dirty(s); if(!managed(g)) toast(s,`${JOB[q.job].name} finished${s.garages.length>1?` at ${g.name}`:""} — complete it to get paid`,"done"); }
      }
      if(m%10===0) autoRun(s,g);
    }
    const boosting=allJobs(s).some(({j})=>j.status==="working"&&j.boost);
    if(!boosting) s.energy=Math.min(100,s.energy+(h>=22||h<6?0.35:(onTools?0.06:0.12)));

function mgmtMult(s,b){ const M=mg(b); const P=PRICE_SET[M.price]; let pm=P.m; if(M.price==="premium"&&M.rep<60) pm=.85;
  const f=M.feats.reduce((t,i)=>t*(1+FEAT_GAIN[i]),1); return pm*STAFF_SET[M.staff].m*MKT_SET[M.mkt].m*repMult(M.rep)*BOSSES[M.boss].m*f; }
function mgmtCost(s,b){ const T=BIZ[b.type], M=mg(b); return Math.round(T.price*MKT_SET[M.mkt].cost*lvlMult(b.level)**.5+T.price*BOSSES[M.boss].fee/YEAR_DAYS*lvlMult(b.level)**.5); }

function buildFeat(s,id,i){ const b=(s.empire||[]).find(x=>x.id===id); if(!b) return {ok:false}; const M=mg(b); if(M.feats.includes(i)) return {ok:false,msg:"Already built."};

  const c=featCost(b,i); if(s.cash<c) return {ok:false,msg:"Not enough cash."}; s.cash-=c; spend(s,c,"invest"); b.cost=(b.cost||0)+c; M.feats.push(i); M.rep=Math.min(100,M.rep+4);

function bizDecide(s,id,ci){ const b=(s.empire||[]).find(x=>x.id===id); if(!b) return {ok:false}; const M=mg(b); if(!M.dec) return {ok:false}; const D=DECISIONS[M.dec.k]; const A=D.a[ci]; if(!A) return {ok:false};
  const e=Math.abs(bizExpected(s,b))||1000; const res=A[1](s,b,e); M.rep=clamp(M.rep,0,100); mlog(s,b,`${D.t}: ${A[0]} — ${res}`); M.dec=null; M.decAt=s.t+ri(s,2,4)*DAY; dirty(s); return {ok:true,res}; }
function bizMgmtDaily(s){ for(const b of (s.empire||[])){ const M=mg(b); const P=PRICE_SET[M.price], St=STAFF_SET[M.staff];

    const c=mgmtCost(s,b); if(c){ s.cash-=c; spend(s,c,"running"); }

function nwq(s){ return s._nw||Math.max(0,s.cash); }
function scale(s,lo,hi){ const w=Math.max(17500,nwq(s)); return Math.round(Math.min(hi,Math.max(lo,w*.02))/1000)*1000; }
function birthday(s){ s.age=(s.age||18)+1; const prev=s.yearStart||{nw:17500,biz:1,fame:0}; const nw=nwq(s); const biz=s.garages.length+(s.empire||[]).length;
  const best=(s.log||[]).find(l=>/bought|took over|won|signed|opened/i.test(l.x));
  s.inbox.push({id:s.nextId++,type:"info",title:`📅 Your year in review`,
    text:`Year in review — net worth ${nw>=prev.nw?"up":"down"} from £${fmtShort(prev.nw)} to £${fmtShort(nw)}. Businesses: ${prev.biz} → ${biz}. Fame: ${Math.round(prev.fame)} → ${Math.round(s.fame||0)}.${best?` Highlight: ${best.x}`:""}`,tone:"good",showAt:s.t});
  s.yearStart={nw,biz,fame:s.fame||0}; if(typeof addPost==="function") addPost(s,`Another huge year for ${s.name} — now worth £${fmtShort(nw)}. 📈`,{big:2}); }

function later(s,days,k,c){ (s.storyLater=s.storyLater||[]).push({at:s.t+days*DAY,k,c}); }
function storyDaily(s){
  for(const L of (s.storyLater||[]).filter(x=>x.at<=s.t)){ const r=LATER[L.k](s,L.c); s.inbox.push({id:s.nextId++,type:"info",title:r.t,text:r.x,tone:r.tone,showAt:s.t}); }
  s.storyLater=(s.storyLater||[]).filter(x=>x.at>s.t);
  for(const r of (s.royalty||[])) if(r.until>s.t&&weekday(s.t)==="Mon"){ s.cash+=r.wk; s.today.rent=(s.today.rent||0)+r.wk; }
  s.royalty=(s.royalty||[]).filter(r=>r.until>s.t);
  if(s.tut>=0&&s.tut<6) return; if((s.storyAt||0)>s.t) return; if(rng(s)>.4) return;
  const seen=s.storySeen||{}; const opts=STORIES.filter(S2=>S2.need(s)&&!((seen[S2.id]||0)>s.t-30*DAY)); if(!opts.length) return;
  const St=pick(s,opts); const c=St.ctx(s); s.inbox.push({id:s.nextId++,type:"story",k:St.id,c,showAt:s.t+ri(s,9,15)*60}); seen[St.id]=s.t; s.storySeen=seen; s.storyAt=s.t+ri(s,2,4)*DAY; }
function storyAnswer(s,pid,ci){ const p=s.inbox.find(x=>x.id===pid); if(!p) return {ok:false}; const St=STORIES.find(x=>x.id===p.k); const C=St&&St.ch[ci]; s.inbox=s.inbox.filter(x=>x!==p); if(!C) return {ok:false};
  const res=C[1](s,p.c); s.log.unshift({t:s.t,x:`${St.title}: ${C[0]} — ${res}`}); dirty(s); return {ok:true,res,title:St.title}; }

// =================== EACH BUSINESS TYPE PLAYS DIFFERENTLY ===================
const MECH={valet:"menu",tyres:"menu",vans:"fleet",restaurant:"rooms",gym:"rooms",dealer:"stock",hire:"fleet",nightclub:"club",distributor:"stock",hotel:"rooms",developer:"build",bank:"bank",carbrand:"brand",airline:"fleet"};
function mx(b){ if(!b.x) b.x={}; return b.x; }
function mechBase(b){ return ["stock","build","brand"].includes(MECH[b.type])?.35:1; } // trading types earn mostly from what you do
// ---- menu (car wash, tyre centre): choose services and price each one
const MENUS={valet:[["Express wash",.3],["Full valet",.3],["Interior deep clean",.2],["Ceramic coating",.2]],tyres:[["Tyre fitting",.35],["Exhausts",.2],["Wheel alignment",.2],["Brakes & batteries",.25]]};
function menuState(b){ const X=mx(b); if(!X.menu) X.menu=MENUS[b.type].map(()=>({on:true,p:1})); return X.menu; }
function menuMult(b){ const M=menuState(b), L=MENUS[b.type]; let r=0; M.forEach((m,i)=>{ if(m.on) r+=L[i][1]*m.p*Math.max(0,1.6-.8*m.p)/.8; }); return r; }
// ---- rooms (hotel, restaurant, gym): rate vs occupancy, plus big bookings
const ROOM_WORD={hotel:["Room rate","rooms booked","per night"],restaurant:["Menu prices","tables full","average bill"],gym:["Membership fee","capacity used","per month"]};
const ROOM_BASE={hotel:320,restaurant:65,gym:55};
function occ(b,r){ const M=mg(b); return clamp(.8-(r-1)*.8+(M.rep-50)/250,.05,1); }
function roomsMult(b){ const r=mx(b).rate||1; return r*occ(b,r)/.8; }
const BOOKINGS={hotel:["Celebrity wedding","World leaders' summit","Film crew block-booking","Tech conference"],restaurant:["Private wedding dinner","Corporate Christmas party","TV cooking show filming","Royal birthday dinner"],gym:["Pro football team pre-season","Boxing title fight camp","Influencer fitness bootcamp","Police training contract"]};
function genBooking(s,b){ const X=mx(b); const E=Math.max(1000,bizExpected(s,b)); X.offer={name:pick(s,BOOKINGS[b.type]),fee:Math.round(E*(2+rng(s)*4)/100)*100,rep:ri(s,30,75),until:s.t+3*DAY}; }
// ---- club (nightclub): weekend line-up + ticket price
const DJS=[{id:"local",name:"Local DJ",cost:.2,draw:1},{id:"rising",name:"Rising star",cost:.8,draw:1.6},{id:"super",name:"Superstar DJ",cost:2.5,draw:2.8,risk:.15},{id:"legend",name:"Global legend",cost:6,draw:4.5,risk:.1}];
// ---- fleet (car hire, vans, airline): buy units up to demand, open depots/routes, keep them running
const FLEET_WORD={hire:["cars","depot","Open a new depot"],vans:["vans","area","Cover a new area"],airline:["planes","route","Open a new route"]};
const ROUTES=["London ⇄ Dubai","London ⇄ New York","Dubai ⇄ Tokyo","Miami ⇄ Madrid","Paris ⇄ Singapore","LA ⇄ Hong Kong","Manchester ⇄ Marbella","Monaco ⇄ Dubai","New York ⇄ Tokyo"];
function fleetState(b){ const X=mx(b); if(X.units==null){ X.units=10; X.cap=1; X.broken=0; X.places=[]; } return X; }
function fleetDemand(b){ const X=fleetState(b); return 8+b.level*2+X.cap*4; }
function fleetMult(b){ const X=fleetState(b); const used=Math.min(X.units-X.broken,fleetDemand(b)); return Math.max(0,used/10-(X.units*.012))/.88; }
function unitCost(b){ return Math.round(BIZ[b.type].price*.06/1000)*1000; }
function capCost(b){ const X=fleetState(b); return Math.round(BIZ[b.type].price*.25*Math.pow(1.5,X.cap-1)/1000)*1000; }
// ---- bank: savings rate and loan rate
function bankState(b){ const X=mx(b); if(X.sav==null){ X.sav=2; X.loan=8; } return X; }
function bankModel(X,rep){ const D=(1+(X.sav-2)*.35)*(.8+rep/250); const L=D*.9*clamp(1-(X.loan-6)/10,.15,1.3); const def=.005+Math.max(0,X.loan-7)*.004; return L*(X.loan/100)-D*(X.sav/100)-L*def; }
function bankMult(b){ const X=bankState(b); return bankModel(X,mg(b).rep)/bankModel({sav:2,loan:8},50); }

function mechMult(s,b){ switch(MECH[b.type]){ case "menu": return menuMult(b); case "rooms": return roomsMult(b); case "fleet": return fleetMult(b); case "bank": return bankMult(b); default: return 1; } }
function mechDaily(s,b,wkend){ const X=mx(b); const E=bizExpected(s,b); let extra=0; const T=MECH[b.type];
  if(T==="club"&&wkend){ const D=DJS.find(x=>x.id===(X.dj||"local")); const tk=X.ticket||1; const crowd=D.draw*clamp(1.4-.4*tk,.2,1.4); let no=D.risk&&rng(s)<D.risk; const cost=Math.round(E*D.cost);
    extra=Math.round((no?E*.5:E*1.2*crowd*tk)-cost); s.cash-=0; mlog(s,b,no?`${D.name} didn't turn up! Refunds everywhere (−£${fmt(cost)} fee).`:`${D.name} night: ${Math.round(crowd*100)}% crowd, +£${fmt(extra+cost)} takings.`); if(no) mg(b).rep-=4; }
  if(T==="rooms"&&!X.offer&&rng(s)<.2) genBooking(s,b);
  if(T==="rooms"&&X.offer&&X.offer.until<=s.t) X.offer=null;
  if(T==="fleet"){ const F=fleetState(b); if(F.broken&&mg(b).boss>=1){ const c=Math.round(unitCost(b)*.15*F.broken); s.cash-=c; spend(s,c,"running"); F.broken=0; } if(rng(s)<.15){ const k=ri(s,1,Math.max(1,Math.round(F.units*.1))); F.broken=Math.min(F.units,F.broken+k); mlog(s,b,`${k} ${FLEET_WORD[b.type][0]} broke down.`); } }
  if(T==="stock"){ const X2=stockState(b); if(!X2.lots||s.t>=X2.lotsAt) genLots(s,b); for(const it of [...X2.stock]) if(rng(s)<sellChance(b,it)){ extra+=it.ask-it.cost; s.cash+=it.cost; X2.stock=X2.stock.filter(x=>x!==it); X2.sold++; mlog(s,b,`Sold ${it.name} for £${fmt(it.ask)} (${it.ask>=it.cost?"+":"−"}£${fmt(Math.abs(it.ask-it.cost))}).`); } }
  if(T==="build"){ const B2=buildState(b); B2.market=clamp(B2.market*(1+gauss(s)*.025),.7,1.4); for(const pj of B2.proj) if(pj.ready<=s.t&&!pj.told){ pj.told=true; mlog(s,b,`${pj.name} is finished and ready to sell.`); toast(s,`${b.name}: ${pj.name} finished`,"done"); } }
  if(T==="brand"){ const B3=brandState(b); for(const m of B3.models){ if(m.launched&&m.left>0){ extra+=Math.round(m.weekly*(.8+rng(s)*.4)); m.left--; } else if(!m.launched&&m.ready<=s.t&&!m.told){ m.told=true; toast(s,`${b.name}: the ${m.name} is ready to launch`,"done"); } } B3.models=B3.models.filter(m=>!m.launched||m.left>0||s.t-m.ready<10*DAY); }

    if(T==="stock"){ const X2=stockState(b); while(X2.lots&&X2.lots.length&&X2.stock.length<stockSlots(b)){ const L=X2.lots.reduce((a,c)=>c.value/c.cost>a.value/a.cost?c:a); if(s.cash<L.cost*5) break; buyLot(s,b.id,L.id); } }

// ===== Sportsbook: bet on this weekend's football =====
const BOOK_BIG=["London Royal FC","Kingsway City","Northgate United","Mersey Albion","Tyne Athletic","Westhill Hotspur","Old Trafford Rangers","Highbury Town"];
function poisP(l,k){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function poisR(s,l){ const L=Math.exp(-l); let k=0, p=1; do{ k++; p*=rng(s); }while(p>L); return k-1; }
function bookLam(hs,as){ const diff=(hs-as)/10+.15; return [1.35*Math.exp(diff*.55),1.35*Math.exp(-diff*.55)]; }
function bookOdds(hs,as){ const [lh,la]=bookLam(hs,as); let h=0,d=0,a=0; for(let i=0;i<9;i++) for(let j=0;j<9;j++){ const p=poisP(lh,i)*poisP(la,j); if(i>j) h+=p; else if(i===j) d+=p; else a+=p; }
  const o=p=>Math.max(1.05,Math.round(100/(p*1.07))/100); return {h:o(h),d:o(d),a:o(a)}; }
function bookState(s){ const B=s.book||(s.book={games:[],bets:[],hist:[],won:0,lost:0,caught:0,wk:0}); if(B.games.length) bookTick(s); if(!B.games.length||(B.games.every(g=>g.res)&&s.t>=B.games[0].at+4*60)) genCoupon(s); return B; }
function genCoupon(s){ const B=s.book; let d=0; while(weekday(s.t+d*DAY)!=="Sun"||dayStart(s.t+d*DAY)+15*60<=s.t) d++; const at=dayStart(s.t+d*DAY)+15*60;
  const games=[]; const used=new Set(); const c=s.club;
  if(c&&c.fixture){ const f=c.fixture, us=c.str+coachBonus(c); used.add(f.opp);
    games.push({id:s.nextId++,own:true,tier:c.tier,home:f.home?c.name:f.opp,away:f.home?f.opp:c.name,hs:f.home?us:f.oppStr,as:f.home?f.oppStr:us,at:f.at}); }
  const name=(tier)=>{ const pool=(tier===1?BOOK_BIG:OPP).filter(n=>!used.has(n)&&!(c&&n===c.name)); const n=pick(s,pool); used.add(n); return n; };
  for(const tier of [1,1,2,3,4]){ const avg=LEAGUES[tier].avg; games.push({id:s.nextId++,tier,home:name(tier),away:name(tier),hs:Math.round(avg+gauss(s)*7),as:Math.round(avg+gauss(s)*7),at}); }
  for(const g of games) g.odds=bookOdds(g.hs,g.as); B.games=games; B.wk++; dirty(s); }
function placeBet(s,gid,pk,stake){ const B=bookState(s); const g=B.games.find(x=>x.id===gid); stake=Math.round(stake);
  if(!g||g.res) return {ok:false,msg:"That market is closed."}; if(s.t>=g.at) return {ok:false,msg:"Kick-off has gone — betting's closed."};
  if(!(stake>0)||s.cash<stake) return {ok:false,msg:"Not enough cash."}; if(!["h","d","a"].includes(pk)) return {ok:false};
  s.cash-=stake; B.bets.push({id:s.nextId++,gid,pk,stake,odds:g.odds[pk],risky:!!s.club,onOwn:!!g.own,against:!!g.own&&((pk==="h")!==(g.home===s.club.name))&&pk!=="d"}); dirty(s); return {ok:true,odds:g.odds[pk]}; }
function settleGame(s,g,hg,ag){ const B=s.book; g.res=hg>ag?"h":hg===ag?"d":"a"; g.hg=hg; g.ag=ag;
  for(const b of B.bets.filter(x=>x.gid===g.id&&!x.done)){ b.done=true; const win=b.pk===g.res; const pay=win?Math.round(b.stake*b.odds):0;
    if(win){ s.cash+=pay; B.won+=pay-b.stake; } else B.lost+=b.stake;
    const pickName=b.pk==="h"?g.home:b.pk==="a"?g.away:"the draw";
    let line=`${g.home} ${hg}–${ag} ${g.away}: ${money0(b.stake)} on ${pickName} @ ${b.odds.toFixed(2)} — ${win?`won ${money0(pay)}`:"lost"}`;
    if(b.risky&&s.club){ const ch=(b.onOwn?.22:.07)+Math.min(.13,Math.max(0,Math.log10(b.stake/1000))*.03);
      if(rng(s)<ch){ const fine=Math.max(25000,b.stake*3)+(win?pay:0); s.cash-=fine; B.caught++; s.fame=Math.max(0,(s.fame||0)-(b.onOwn?60:30)); let extra="";
        if(b.against&&s.club){ s.club.pts=Math.max(0,s.club.pts-6); extra=" Betting against your own club: the FA also docked 6 points."; }
        addInfo(s,"⚠ Caught: illegal betting",`The FA traced a ${money0(b.stake)} bet back to you. As a club owner, betting on football breaks the rules. Fine${win?" plus confiscated winnings":""}: ${money0(fine)}. Fame −${b.onOwn?60:30}.${extra}`,"bad");
        socialPost(s,"scandal",{x:"betting"}); line+=" · CAUGHT"; } }
    B.hist.unshift({x:line,win,net:win?pay-b.stake:-b.stake}); if(B.hist.length>15) B.hist.length=15; toast(s,win?`Bet won! +${money0(pay)}`:`Bet lost · ${pickName}`,win?"cash":"ping"); }
  dirty(s); }
const money0=n=>"£"+Math.round(n).toLocaleString("en-GB");
function bookTick(s){ const B=s.book; if(!B||!B.games.length) return; let left=false;
  for(const g of B.games){ if(g.res) continue; if(g.own){ if(!s.club||s.t>g.at+3*60){ const [lh,la]=bookLam(g.hs,g.as); settleGame(s,g,poisR(s,lh),poisR(s,la)); } else left=true; continue; }
    if(s.t>=g.at){ const [lh,la]=bookLam(g.hs,g.as); settleGame(s,g,poisR(s,lh),poisR(s,la)); } else left=true; }
  if(!left&&s.t>=B.games[0].at+4*60) genCoupon(s); }
function bookOwn(s,f,gf,ga){ const B=s.book; if(!B) return; const g=B.games.find(x=>x.own&&!x.res); if(!g) return; const home=g.home===s.club.name; settleGame(s,g,home?gf:ga,home?ga:gf); }

    ${fac("academy")}${fac("training")}${fac("shop")}

    <div class="card"><h3>Pre-season tour</h3><div class="muted" style="font-size:12.5px">${c.tier>2?"Only Championship and Premier League clubs get invited.":c.toured?"You've toured this season.":"Play friendlies abroad for a big payday and +6 fame. Your garages in that city get a boost too."}</div><div class="chips">${TOURS.map((T,i)=>`<button class="btn small ghost" type="button" data-tour="${i}" ${c.tier>2||c.toured?"disabled":""}>${T.name}</button>`).join("")}</div></div>`; }
  else body=`<div class="card"><div class="kv"><span>Wages</span><span class="num bad">${money(clubWages(c))}/wk</span><span>TV money</span><span class="num good">${money(L.tv)}/match</span><span>Home gate</span><span class="num good">${money(c.capacity*att*c.price)} (${Math.round(att*100)}% full)</span></div>

    <div class="card"><h3>Find a buyer</h3><div class="muted" style="font-size:12.5px">Hire bankers to pitch ${esc(c.name)} to investors (fee ${money(Math.round(clubValue(c)*0.005/1000)*1000)}). Lower-league clubs get offers around their value; a strong Premier League side gets 1.4–2.2×. Only a title-winning club can tempt the Saudi-backed consortium (2.5–4.5×). Any offer lasts 5 days — accept it or turn it down.</div>
      <div><button class="btn small" type="button" id="shopclub" ${c.offer||(c.shopAt||0)>S.t?"disabled":""}>${c.offer?"You have an offer above":(c.shopAt||0)>S.t?`Bankers busy until ${when(S,c.shopAt)}`:"Pitch to investors"}</button></div></div>
    <div class="muted" style="font-size:12.5px">Big takeover bids only come for an exceptionally successful Premier League club — win the title or keep finishing top 4.</div>
    ${c.history.length?`<div class="muted" style="font-size:12.5px">History: ${c.history.slice(0,4).map(h=>`Season ${h.season} · ${h.tier} · ${h.pos}${h.pos===1?"st":h.pos===2?"nd":h.pos===3?"rd":"th"}`).join(" · ")}</div>`:""}</div>`;
  if(cSeg==="club") body+=`<div class="sechead" style="margin-top:14px"><h2>Move up to a bigger club</h2></div>${clubShop()}`;
  return offer+head+seg+body;
}

const CITY_LAYOUT={paris:["hero","acts","holiday","biz"],hongkong:["hero","biz","acts","holiday"],la:["hero","acts","biz","holiday"],singapore:["hero","biz","acts","holiday"],london:["hero","biz","acts","holiday"],manchester:["hero","acts","biz","holiday"],monaco:["hero","acts","holiday","biz"],marbella:["hero","holiday","acts","biz"],dubai:["hero","acts","biz","holiday"],newyork:["hero","biz","acts","holiday"],miami:["hero","acts","holiday","biz"],tokyo:["hero","acts","biz","holiday"]};
